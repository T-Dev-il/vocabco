<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>

<!--
  studio.html — frame 1 of studio-design-proposal.md rev 2: the studio at rest.

  Spine left, stage centre, teacher's corner right, deck below. Reads a real
  lesson from the database. No editing.

  THE GUARD (proposal §1, route.md §4). This page does not import from
  surface.html, does not share a file with it, and does not read anything it
  writes. Same database, same config.js, no shared code. Deleting surface.html
  must cost this page nothing.

  What is deliberately copied, with its reason:
    - A lesson is walked as ONE ORDERED LIST of slots. 005-outcomes.sql: a
      condition decides who sees a slot; it never branches the walk. So the
      trunk is straight and only conditional strips hang off it.
    - Everything points at a slot id, never a position (001-sequences.sql, the
      comment on the slots table). Reorder changes nothing about what anything
      points at.
    - activities.content is never selected in a list query (001-sequences.sql:
      "potentially large -- never select it in a list query", FIX-004/FIX-006).
      The spine query takes id, name, kind. Content is fetched for one activity
      at a time, when it goes on the stage.

  Written by Contractor 07, 2026-09-09. No fix number: construction, not repair.
-->

<style>
  /* ── chrome ────────────────────────────────────────────────────────────
     Tokens lifted from studio-mockups-all.html so the build and the drawing
     stay comparable. The mockup left typography plain on purpose; so does this. */
  :root{
    --stage:#FCFCFA; --chrome:#262A2E; --rail:#EDEEEA; --ink:#1B1E21;
    --dim:#6B7178; --here:#0F5D8C; --hand:#F5EFE2; --handline:#CDBE9E;
    --line:#D9DBD5; --felt:#E4E6E0; --past:#7A8288;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--rail); color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* window tabs — the canvas is a separate window (§2); this is its doorway */
  .apptop{
    height:38px; flex:0 0 38px; background:#DFE1DB; display:flex;
    align-items:flex-end; gap:3px; padding:0 10px; border-bottom:1px solid #C8CBC4;
  }
  .apptab{
    font-size:12.5px; padding:6px 14px; border-radius:6px 6px 0 0; color:var(--dim);
    background:#EAEBE6; border:1px solid #C8CBC4; border-bottom:none;
    cursor:pointer; font-family:inherit;
  }
  .apptab.on{background:#fff; color:var(--ink); font-weight:600; cursor:default}
  .apptab[disabled]{opacity:.5; cursor:not-allowed}

  .top{
    height:38px; flex:0 0 38px; background:#fff; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:0 12px;
  }
  .lesson{font-weight:650; font-size:13.5px; border:0; background:transparent;
          font-family:inherit; color:inherit; max-width:44ch; padding:2px 4px}
  .lesson:focus-visible{outline:2px solid var(--here); outline-offset:1px}
  .modes{display:flex; gap:2px; margin-left:auto}
  .modes button{
    font-size:12px; color:var(--dim); padding:3px 9px; border-radius:4px;
    border:0; background:transparent; font-family:inherit; cursor:pointer;
  }
  .modes button.on{background:var(--chrome); color:#fff}
  .modes button.off{opacity:.4}
  .modes button[disabled]{opacity:.28; cursor:not-allowed}

  .body{flex:1; display:flex; min-height:0}
  .lbl{font-size:10.5px; color:var(--dim); padding:7px 10px 5px}

  /* ── the spine ─────────────────────────────────────────────────────────
     Vertical, read as an outline. A tree indents, and indentation is free
     vertically and expensive horizontally (§3). */
  .pane{
    flex:0 0 244px; background:#fff; border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-width:0;
  }
  .spine{padding:0 10px 10px; display:flex; flex-direction:column; gap:5px;
         overflow-y:auto; flex:1}
  .kids{margin-left:16px; display:flex; flex-direction:column; gap:5px}

  .step,.hand{
    border-radius:5px; padding:7px 9px; font-size:12.5px; display:flex; gap:8px;
    align-items:center; text-align:left; width:100%; font-family:inherit;
    cursor:pointer; color:inherit;
  }
  .step{background:#fff; border:1px solid var(--line)}
  .hand{background:var(--hand); border:1px solid var(--handline); font-size:12px;
        position:relative; border-radius:5px 5px 5px 0}
  /* the tab that makes a handout read as handed to you */
  .hand::after{
    content:""; position:absolute; left:-1px; bottom:-7px; width:12px; height:7px;
    background:var(--hand); border:1px solid var(--handline); border-top:none;
    border-radius:0 0 3px 3px;
  }
  .step .n,.hand .n{font-size:11px; min-width:12px}
  .step .n{color:var(--dim)}
  .hand .n{color:#9a8a68}
  .step .kind,.hand .kind{color:var(--dim); font-size:11px; margin-left:auto;
                          padding-left:8px; white-space:nowrap}
  .hand .kind{color:#9a8a68}
  .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* blue means one thing only: where the learner is */
  .step.here,.hand.here{border-color:var(--here); box-shadow:inset 3px 0 0 var(--here)}
  /* the second cursor: where you are looking. Never moves your place. */
  .step.looking,.hand.looking{
    border-color:var(--past); border-style:dashed;
    box-shadow:inset 3px 0 0 var(--past); background:#F6F7F5;
  }
  .hand.looking{background:#F6F2E7}
  .step.here.looking,.hand.here.looking{
    border-style:solid; border-color:var(--here);
    box-shadow:inset 3px 0 0 var(--here), 0 0 0 2px #cfe0ea;
  }
  .step.ghost{background:transparent; border-style:dashed; color:var(--dim)}
  .hand.ghost{background:transparent; border-style:dashed; color:var(--dim)}
  .hand.ghost::after{background:transparent}
  .step:focus-visible,.hand:focus-visible,.apptab:focus-visible,
  .modes button:focus-visible,.btn:focus-visible{
    outline:2px solid var(--here); outline-offset:2px;
  }
  .cond{font-size:11px; color:var(--dim); padding:1px 2px}

  .panefoot{margin-top:auto; padding:10px; border-top:1px solid var(--line)}

  /* ── the stage ─────────────────────────────────────────────────────────
     Renders the lesson in the learner's own typography. The studio never
     restyles it — otherwise the teacher designs against a lie (§3). */
  .stage{flex:1; background:var(--rail); padding:13px; display:flex;
         flex-direction:column; min-width:0; gap:9px}
  .look{
    display:flex; align-items:center; gap:9px; font-size:11.5px; color:var(--dim);
    min-height:22px;
  }
  .look b{color:var(--ink); font-weight:600}
  .paper{
    flex:1; background:var(--stage); border:1px solid var(--line); border-radius:6px;
    padding:22px 26px; overflow:auto;
  }

  /* The learner's typography, scoped. Everything inside .learner belongs to the
     reader, not to the studio. Replace this block wholesale with the reader's
     own stylesheet when the reader and the studio meet — nothing outside it
     depends on anything inside it. */
  .learner{
    --vc-text:#1a1c19; --vc-text2:#62655f; --vc-text3:#9b9e96;
    --vc-accent-bg:#edffdf; --vc-accent-line:#a8cf8e; --vc-accent-text:#4a7a35;
    color:var(--vc-text);
    font:16px/1.7 ui-serif,Georgia,"Times New Roman",serif;
    max-width:62ch;
  }
  .learner h1{font:600 22px/1.35 inherit; margin:0 0 12px}
  .learner p{margin:0 0 12px}
  .learner .mark{background:var(--vc-accent-bg); border-bottom:2px solid var(--vc-accent-line);
                 padding:0 2px}
  .learner .vid{
    height:150px; background:#20242a; border-radius:5px; margin:0 0 14px;
    display:flex; align-items:center; justify-content:center;
    color:#7b838c; font:12px/1.4 ui-sans-serif,system-ui,sans-serif;
    text-align:center; padding:0 16px;
  }
  .learner .raw{
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap;
    background:#F4F4F0; border:1px solid var(--line); border-radius:5px; padding:10px;
    color:#3a3f36; max-height:340px; overflow:auto;
  }
  .unknown{font:13px/1.6 ui-sans-serif,system-ui,sans-serif; color:var(--dim);
           margin:0 0 10px; max-width:60ch}

  /* ── the teacher's corner ──────────────────────────────────────────────── */
  .auto{flex:0 0 214px; background:var(--chrome); color:#E8EAEC; display:flex;
        flex-direction:column; overflow-y:auto}
  .auto .lbl{color:#8B939B}
  .auto .box{margin:0 10px 8px; background:#31363C; border:1px solid #3E444B;
             border-radius:5px; padding:7px 9px; font-size:11.5px; color:#C6CCD2;
             line-height:1.5}
  .auto .cam{height:70px; background:#171A1E; border-radius:5px; margin:0 10px 8px;
             display:flex; align-items:center; justify-content:center;
             color:#5E666E; font-size:11px}
  .auto .act{font-size:11px; color:#98A0A8; padding:2px 10px; display:flex; gap:8px}
  .auto .act b{color:#E8EAEC; font-weight:500}
  .auto .t{font-variant-numeric:tabular-nums; color:#7E868E; min-width:34px}
  .auto .none{font-size:11px; color:#7E868E; padding:0 10px 8px; line-height:1.5}
  .autofoot{margin-top:auto; padding:10px}

  .btn{border:1px solid #4A5158; background:#31363C; border-radius:4px;
       padding:4px 9px; font-size:11.5px; color:#E8EAEC; font-family:inherit;
       cursor:pointer}
  .btn.light{background:#fff; border-color:var(--line); color:var(--ink)}
  .btn.wide{display:block; width:100%; text-align:center}
  .btn[disabled]{opacity:.45; cursor:not-allowed}

  /* ── the deck ──────────────────────────────────────────────────────────
     Exists only when there is a clock (§3). At rest there is none, so this
     element is absent from the DOM rather than empty. */
  .deck{
    height:44px; flex:0 0 44px; background:var(--chrome); color:#E8EAEC;
    display:flex; align-items:center; gap:12px; padding:0 12px; font-size:12px;
  }
  .deck .clock{font-variant-numeric:tabular-nums; font-size:14px}
  .track{flex:1; height:5px; background:#3E444B; border-radius:3px; position:relative}
  .track u{position:absolute; left:0; top:0; height:5px; width:0; background:#59626B;
           border-radius:3px}
  .track i{position:absolute; left:0; top:-4px; width:2px; height:13px; background:var(--here)}

  /* ── whole-screen states ───────────────────────────────────────────────── */
  .screen{
    flex:1; display:grid; place-items:center; padding:40px 24px; background:var(--rail);
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:9px;
    padding:24px 26px; max-width:52ch; line-height:1.6;
  }
  .card h2{font-size:16px; font-weight:650; margin:0 0 8px}
  .card p{margin:0 0 12px; color:var(--dim); font-size:13.5px}
  .card a{color:var(--here)}
  .card ul{margin:0 0 12px; padding-left:18px; color:var(--dim); font-size:13.5px}
  .card code{font:12px ui-monospace,Menlo,monospace; background:#F2F3EF; padding:1px 4px;
             border-radius:3px}

  select{font:12.5px inherit; font-family:inherit; padding:2px 4px;
         border:1px solid var(--line); border-radius:4px; background:#fff;
         color:var(--ink); max-width:30ch}


  /* ── the quick rack ────────────────────────────────────────────────────
     Lands over the stage, so the spine and the corner stay visible either
     side. You are never taken out of the lesson to add to it (frames 2-3). */
  .scrim{position:absolute; inset:0; background:rgba(24,27,30,.30)}
  .panel{
    position:absolute; top:16px; bottom:16px; left:0; right:0; margin:0 18px;
    background:#fff; border:1px solid #C3C6BF; border-radius:9px;
    box-shadow:0 14px 40px rgba(20,24,28,.22); display:flex; flex-direction:column;
    overflow:hidden;
  }
  .phead{
    display:flex; align-items:center; gap:9px; padding:10px 14px;
    border-bottom:1px solid var(--line); font-size:13.5px; font-weight:600;
  }
  .pbody{flex:1; overflow-y:auto; padding:14px}
  .pfoot{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    border-top:1px solid var(--line); font-size:11.5px; color:var(--dim);
  }
  .kinds{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
  .kindbtn{
    border:1px solid var(--line); border-radius:6px; background:#fff; padding:14px 10px;
    font-family:inherit; font-size:12.5px; cursor:pointer; text-align:left; color:inherit;
    line-height:1.45;
  }
  .kindbtn b{display:block; font-weight:600; margin-bottom:3px; font-size:13px}
  .kindbtn span{color:var(--dim); font-size:11.5px}
  .kindbtn:hover{border-color:var(--here)}
  .form{max-width:58ch}
  .field{margin-bottom:15px}
  .field label{display:block; font-size:11.5px; color:var(--dim); margin-bottom:5px}
  .inp{
    width:100%; border:1px solid var(--line); border-radius:5px; padding:7px 9px;
    font:13px/1.5 inherit; font-family:inherit; color:var(--ink); background:#fff;
  }
  textarea.inp{min-height:96px; resize:vertical}
  .opt{display:flex; gap:8px; align-items:center; margin-bottom:6px}
  .opt input[type=radio]{accent-color:var(--here); flex:0 0 auto; margin:0}
  .opt .inp{flex:1}
  .opt .drop{
    border:0; background:transparent; color:var(--dim); font-family:inherit;
    font-size:15px; cursor:pointer; padding:0 4px; line-height:1;
  }
  .addopt{
    border:0; background:transparent; color:var(--here); font-family:inherit;
    font-size:12px; cursor:pointer; padding:2px 0;
  }
  .why{font-size:11.5px; color:var(--dim); margin:0 0 14px; max-width:58ch; line-height:1.55}
  .err{color:#8a2d2d; font-size:12px; margin:0 0 10px}

  /* what the learner sees, drawn but not usable — Build shows, Preview will run */
  .learner .q{margin:0 0 12px; font-weight:600}
  .learner .opts{list-style:none; margin:0 0 12px; padding:0}
  .learner .opts li{
    display:flex; gap:9px; align-items:flex-start; padding:7px 10px; margin-bottom:6px;
    border:1px solid var(--line); border-radius:5px; background:#fff;
  }
  .learner .opts .bul{
    flex:0 0 13px; height:13px; margin-top:4px; border:1px solid #b6bbb0; border-radius:50%;
  }
  .learner .opts li.right .bul{border-color:var(--vc-accent-line); background:var(--vc-accent-bg)}
  .learner .ord{counter-reset:o; list-style:none; margin:0 0 12px; padding:0}
  .learner .ord li{
    counter-increment:o; padding:7px 10px 7px 34px; margin-bottom:6px; position:relative;
    border:1px solid var(--line); border-radius:5px; background:#fff;
  }
  .learner .ord li::before{
    content:counter(o); position:absolute; left:11px; top:7px; color:var(--vc-text3);
    font:12px ui-sans-serif,system-ui,sans-serif;
  }
  .learner .gap{
    display:inline-block; min-width:78px; border-bottom:2px solid var(--vc-accent-line);
    background:var(--vc-accent-bg);
  }
  .learner .after{
    font:12px/1.6 ui-sans-serif,system-ui,sans-serif; color:var(--vc-text2);
    border-top:1px solid var(--line); padding-top:9px; margin-top:14px;
  }
  .learner .carries{
    font:11.5px/1.6 ui-sans-serif,system-ui,sans-serif; color:var(--vc-text3); margin-top:6px;
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<body>
<div id="root"><div class="screen"><div class="card"><h2>Opening the studio</h2>
<p>Reading the lesson.</p></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

// ───────────────────────────────────────────────────────────────────────────
// State. One object, read by render(), written by the loaders.
// ───────────────────────────────────────────────────────────────────────────
const S = {
  env: 'live', sb: null,
  lessons: [], lesson: null,
  slots: [], acts: {}, seqs: {},
  hereSlot: null,      // where the learner is    — from progress.slot_id
  lookSlot: null,      // where you are looking   — never written to the database
  content: null, contentFor: null, contentErr: null,
  takes: [], openTake: null,
  mode: 'build',
  rack: null,          // {kind, opts:n} while the quick rack is open
  rackErr: null, saving: false,
  att: {},            // slot_id -> latest attempt status, for conditions and gates
  live: {},           // slot_id -> what you have done to it in Preview, unsaved
  handed: {},         // slot_id -> this handout has been given. Preview only.
  finished: false,
  error: null
};

const root = document.getElementById('root');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function screen(title, html) {
  root.innerHTML = '<div class="screen"><div class="card"><h2>' + esc(title) + '</h2>' + html + '</div></div>';
}

function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => no(new Error(src));
    document.head.appendChild(s);
  });
}

// ───────────────────────────────────────────────────────────────────────────
// Boot
// ───────────────────────────────────────────────────────────────────────────
(async function boot() {
  // config.js is the shared file (its own header says so). The studio may sit
  // one folder down from the site root, so try both and say plainly if neither
  // is there — a missing config is otherwise a silent blank page.
  try { await loadScript('../config.js'); }
  catch (e) {
    try { await loadScript('config.js'); }
    catch (e2) {
      return screen('config.js is not where this page looked',
        '<p>The studio tried <code>../config.js</code> and <code>config.js</code> and found neither. ' +
        'It needs the same config the rest of the site uses — it must not keep its own copy of the ' +
        'database details.</p><p>Put this page in a folder beside <code>config.js</code>, ' +
        'or one folder below it.</p>');
    }
  }

  try { S.env = localStorage.getItem('vocabEnv') || 'live'; } catch (e) {}
  const env = vocabEnv(S.env);
  S.env = env.name;

  if (!window.supabase || !supabase.createClient) {
    return screen('The database library did not load',
      '<p>This page pulls supabase-js from a CDN, the same way <code>index.html</code> does. ' +
      'Check the connection, then reload.</p>');
  }

  // persistSession picks up the session the main app already stored, on this
  // same origin. The studio does not have its own sign-in and should not.
  S.sb = supabase.createClient(env.url, env.anon, {
    auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true }
  });

  // the DEV badge, from config.js — forgetting which database you are in is
  // exactly the failure it exists to prevent
  vocabEnvBanner(S.env, () => {});

  const { data: { session } } = await S.sb.auth.getSession();
  if (!session) {
    return screen('Sign in on the main app first',
      '<p>The studio uses the session the app already holds. Open the app, sign in, ' +
      'then come back to this page.</p>' +
      '<p>You are pointed at the <b>' + esc(env.label) + '</b> database.</p>');
  }

  // Does this database have 006-register.sql? Asking once, up front, is better
  // than finding out halfway through saving something.
  const probe = await S.sb.from('slots').select('register,parent_slot_id').limit(1);
  S.has006 = !probe.error;

  await loadLessons();
  render();
})().catch(e => screen('The studio stopped', '<p>' + esc(e && e.message || e) + '</p>'));

// ───────────────────────────────────────────────────────────────────────────
// Loading
// ───────────────────────────────────────────────────────────────────────────
async function loadLessons() {
  // No filter on kind, and none on master_id. A linked copy (§7) is still a
  // lesson you can open, and 'lesson' is a label for the screen rather than a
  // rule (001-sequences.sql) — filtering on either would show an empty studio
  // for real data.
  const { data, error } = await S.sb.from('sequences')
    .select('id,name,kind,updated_at,master_id')
    .is('deleted_at', null)
    .order('updated_at', { ascending: false });
  if (error) { S.error = error.message; return; }
  S.lessons = data || [];

  const wanted = new URLSearchParams(location.search).get('lesson');
  const pick = (wanted && S.lessons.find(l => l.id === wanted)) || S.lessons[0];
  if (pick) await openLesson(pick.id);
}

async function openLesson(id) {
  S.lesson = S.lessons.find(l => l.id === id) || null;
  S.slots = []; S.acts = {}; S.seqs = {}; S.takes = [];
  S.hereSlot = null; S.lookSlot = null;
  S.content = null; S.contentFor = null; S.contentErr = null; S.openTake = null;
  if (!S.lesson) return;

  // One ordered list. deleted_at came in with 002-slots-soft-delete.sql.
  const cols = 'id,activity_id,child_sequence_id,position,condition,gate';
  let { data: slots, error } = await S.sb.from('slots')
    .select(cols + ',register,parent_slot_id')
    .eq('sequence_id', id).is('deleted_at', null)
    .order('position', { ascending: true });
  if (error && /register|parent_slot_id|column/i.test(error.message)) {
    // 006-register.sql is not applied here. Fall back to deriving both, which
    // is what this page did before the columns existed.
    S.needs006 = true;
    ({ data: slots, error } = await S.sb.from('slots')
      .select(cols).eq('sequence_id', id).is('deleted_at', null)
      .order('position', { ascending: true }));
  }
  if (error) { S.error = error.message; return; }
  S.slots = slots || [];

  // NO content in this query. See the header.
  const actIds = S.slots.map(s => s.activity_id).filter(Boolean);
  if (actIds.length) {
    const { data } = await S.sb.from('activities').select('id,name,kind').in('id', actIds);
    (data || []).forEach(a => { S.acts[a.id] = a; });
  }
  const seqIds = S.slots.map(s => s.child_sequence_id).filter(Boolean);
  if (seqIds.length) {
    const { data } = await S.sb.from('sequences').select('id,name,kind').in('id', seqIds);
    (data || []).forEach(q => { S.seqs[q.id] = q; });
  }

  const { data: prog } = await S.sb.from('progress')
    .select('slot_id').eq('sequence_id', id).maybeSingle();
  S.hereSlot = prog ? prog.slot_id : null;

  // Looking starts where you are. If nobody has started, it starts at the top.
  S.lookSlot = S.hereSlot || (S.slots[0] && S.slots[0].id) || null;

  await loadAttempts(id);
  await loadTakes(id);
  if (S.lookSlot) await loadContent(S.lookSlot);
}

async function loadTakes(seqId) {
  const { data: recs } = await S.sb.from('recordings')
    .select('id,name,created_at').eq('sequence_id', seqId)
    .is('deleted_at', null).order('created_at', { ascending: true });
  S.takes = recs || [];
  if (!S.takes.length) return;
  // A take's clock is the sum of its clips and must never be wall-clock (§6).
  // Clip count is all this page can honestly report — see the note in the corner.
  const { data: clips } = await S.sb.from('clips')
    .select('id,recording_id').in('recording_id', S.takes.map(t => t.id))
    .is('deleted_at', null);
  const n = {};
  (clips || []).forEach(c => { n[c.recording_id] = (n[c.recording_id] || 0) + 1; });
  S.takes.forEach(t => { t.clips = n[t.id] || 0; });
}

async function loadContent(slotId) {
  S.content = null; S.contentErr = null; S.contentFor = slotId;
  const slot = S.slots.find(s => s.id === slotId);
  if (!slot || !slot.activity_id) return;
  const { data, error } = await S.sb.from('activities')
    .select('content').eq('id', slot.activity_id).maybeSingle();
  if (S.contentFor !== slotId) return;          // a later click won the race
  if (error) { S.contentErr = error.message; return; }
  S.content = data ? data.content : null;
}


// ───────────────────────────────────────────────────────────────────────────
// The quick rack — six kinds and no more (§2).
//
// No settings beyond the content. During a take, fewer options is the feature:
// pick, type, hand out, three seconds. Flexibility lives in which activities
// exist, not in how many decisions each one costs mid-lesson.
//
// Every shape carries an empty `carries` for §8 — the vocabulary and structures
// an activity holds. Nothing fills it yet and nothing reads it. It is here so
// that when something does, there is an obvious place for it rather than a
// decision to make. In dev the data is disposable, so this is the whole of the
// insurance §8 is owed.
//
// These shapes are deliberately plain and expected to change. They are written
// in one place so changing one means changing one thing.
// ───────────────────────────────────────────────────────────────────────────
const CARRIES = { vocab: [], structures: [] };

const KINDS = {
  mcq: {
    label: 'Multiple choice',
    hint: 'A question and a few answers, one of them right.',
    blank: () => ({ ask:'', options:['',''], answer:0, on_wrong:'carry_on', carries:{...CARRIES} }),
    name: c => c.ask,
    form: c => field('Ask', input('ask', c.ask)) + optionList(c) + onWrong(c),
    read: el => {
      const opts = [...el.querySelectorAll('[data-opt]')].map(i => i.value.trim()).filter(Boolean);
      const picked = el.querySelector('[name=right]:checked');
      return {
        ask: val(el,'ask'), options: opts,
        answer: picked ? Math.min(+picked.value, Math.max(0, opts.length-1)) : 0,
        on_wrong: val(el,'on_wrong') || 'carry_on', carries:{...CARRIES}
      };
    },
    check: c => !c.ask ? 'The question is empty.'
              : c.options.length < 2 ? 'A multiple choice needs at least two answers.' : null,
    draw: c => '<p class="q">' + esc(c.ask) + '</p><ul class="opts">' +
      (c.options||[]).map((o,i) =>
        '<li' + (i === c.answer ? ' class="right"' : '') + '><span class="bul"></span><span>' +
        esc(o) + '</span></li>').join('') + '</ul>' + afterLine(c)
  },

  truefalse: {
    label: 'True or false',
    hint: 'One statement. They say whether it holds.',
    blank: () => ({ ask:'', answer:true, on_wrong:'carry_on', carries:{...CARRIES} }),
    name: c => c.ask,
    form: c => field('The statement', input('ask', c.ask)) +
      field('Is it true?', radioPair('answer', c.answer)) + onWrong(c),
    read: el => ({ ask: val(el,'ask'), answer: val(el,'answer') === 'true',
                   on_wrong: val(el,'on_wrong') || 'carry_on', carries:{...CARRIES} }),
    check: c => !c.ask ? 'The statement is empty.' : null,
    draw: c => '<p class="q">' + esc(c.ask) + '</p><ul class="opts">' +
      ['True','False'].map((t,i) =>
        '<li' + ((i === 0) === !!c.answer ? ' class="right"' : '') +
        '><span class="bul"></span><span>' + t + '</span></li>').join('') + '</ul>' + afterLine(c)
  },

  order: {
    label: 'Put in order',
    hint: 'Lines that arrive shuffled and have one right sequence.',
    blank: () => ({ ask:'', items:['',''], carries:{...CARRIES} }),
    name: c => c.ask,
    form: c => field('Ask', input('ask', c.ask)) +
      field('The right order — one line each, top to bottom', lineList(c.items)),
    read: el => ({ ask: val(el,'ask'),
                   items: [...el.querySelectorAll('[data-item]')].map(i=>i.value.trim()).filter(Boolean),
                   carries:{...CARRIES} }),
    check: c => !c.ask ? 'The instruction is empty.'
              : c.items.length < 2 ? 'Nothing to order with fewer than two lines.' : null,
    draw: c => '<p class="q">' + esc(c.ask) + '</p><ol class="ord">' +
      (c.items||[]).map(i => '<li>' + esc(i) + '</li>').join('') + '</ol>' +
      '<p class="after">The learner sees these shuffled.</p>'
  },

  blank: {
    label: 'Fill the blank',
    hint: 'A sentence with a gap. Write ___ where the gap goes.',
    blank: () => ({ text:'', answer:'', carries:{...CARRIES} }),
    name: c => c.text,
    form: c => field('The sentence — put ___ where the gap goes', input('text', c.text)) +
      field('What goes in it', input('answer', c.answer)),
    read: el => ({ text: val(el,'text'), answer: val(el,'answer'), carries:{...CARRIES} }),
    check: c => !c.text ? 'The sentence is empty.'
              : c.text.indexOf('___') < 0 ? 'No gap in the sentence — put ___ where it goes.'
              : !c.answer ? 'Nothing to fill the gap with.' : null,
    draw: c => {
      const bits = String(c.text || '').split('___');
      let out = '<p class="q">';
      bits.forEach((b, i) => {
        out += esc(b);
        if (i < bits.length - 1) out += '<span class="gap"></span>';
      });
      return out + '</p><p class="after">Fills with: ' + esc(c.answer) + '</p>';
    }
  },

  video: {
    label: 'Show a video',
    hint: 'A video the whole class watches together.',
    blank: () => ({ title:'', url:'', carries:{...CARRIES} }),
    name: c => c.title || c.url,
    form: c => field('What to call it', input('title', c.title)) +
      field('Address of the video', input('url', c.url)),
    read: el => ({ title: val(el,'title'), url: val(el,'url'), carries:{...CARRIES} }),
    check: c => !c.url ? 'No video address.' : null,
    draw: c => '<div class="vid">A video activity does not play its own video yet.<br>' +
      'Only the walkthrough\'s player is real.</div>' +
      (c.title ? '<p class="q">' + esc(c.title) + '</p>' : '') +
      '<p class="after">' + esc(c.url) + '</p>'
  },

  display: {
    label: 'Something to read',
    hint: 'A blank sheet to write on. No question, nothing to answer.',
    blank: () => ({ body:'', carries:{...CARRIES} }),
    name: c => (c.body||'').split('\n')[0],
    form: c => field('What it says', textarea('body', c.body)),
    read: el => ({ body: val(el,'body'), carries:{...CARRIES} }),
    check: c => !c.body ? 'Nothing written on it.' : null,
    draw: c => (c.body||'').split(/\n\s*\n/).map(p => '<p>' + esc(p.trim()) + '</p>').join('')
  }
};

const KIND_ORDER = ['mcq','truefalse','order','blank','video','display'];

function afterLine(c) {
  return c.on_wrong === 'explain'
    ? '<p class="after">Get it wrong and they are sent to an explanation.</p>'
    : '<p class="after">Get it wrong and the lesson carries on.</p>';
}

// ── form helpers ───────────────────────────────────────────────────────────
function field(label, inner) {
  return '<div class="field"><label>' + esc(label) + '</label>' + inner + '</div>';
}
function input(name, v) {
  return '<input class="inp" data-f="' + name + '" value="' + esc(v || '') + '">';
}
function textarea(name, v) {
  return '<textarea class="inp" data-f="' + name + '">' + esc(v || '') + '</textarea>';
}
function radioPair(name, isTrue) {
  return ['true','false'].map(v =>
    '<label class="opt"><input type="radio" name="' + name + '" data-f="' + name +
    '" value="' + v + '"' + ((v === 'true') === !!isTrue ? ' checked' : '') + '>' +
    '<span>' + (v === 'true' ? 'True' : 'False') + '</span></label>').join('');
}
function optionList(c) {
  const rows = (c.options || ['','']).map((o,i) =>
    '<div class="opt"><input type="radio" name="right" value="' + i + '"' +
    (i === (c.answer||0) ? ' checked' : '') + ' aria-label="This one is right">' +
    '<input class="inp" data-opt value="' + esc(o) + '">' +
    '<button class="drop" data-dropopt title="Remove this answer">&times;</button></div>').join('');
  return '<div class="field"><label>Answers — pick the right one</label>' +
    '<div id="opts">' + rows + '</div>' +
    '<button class="addopt" id="addopt">Add another answer</button></div>';
}
function lineList(items) {
  const rows = (items || ['','']).map(t =>
    '<div class="opt"><input class="inp" data-item value="' + esc(t) + '">' +
    '<button class="drop" data-dropopt title="Remove this line">&times;</button></div>').join('');
  return '<div id="opts">' + rows + '</div>' +
    '<button class="addopt" id="additem">Add another line</button>';
}
function onWrong(c) {
  return '<div class="field"><label>If they get it wrong</label>' +
    '<select class="inp" data-f="on_wrong">' +
    '<option value="carry_on"' + (c.on_wrong !== 'explain' ? ' selected' : '') + '>Carry on</option>' +
    '<option value="explain"' + (c.on_wrong === 'explain' ? ' selected' : '') + '>' +
    'Send them to an explanation</option></select></div>';
}
function val(el, name) {
  const f = el.querySelector('[data-f="' + name + '"]:checked') || el.querySelector('[data-f="' + name + '"]');
  return f ? f.value.trim() : '';
}

// ───────────────────────────────────────────────────────────────────────────
// Structure and register
//
// The schema stores NEITHER of these yet, and the design (§4) says register is
// separate from structure and authorable. Both are derived here as a stopgap,
// in one place each, so that when slots gains the columns there are exactly two
// functions to change.
//
//   structure — is this slot attached to another, or its own step?
//               Derived from `condition`: a slot shown only on the outcome of
//               another slot hangs off that slot. That much is real data.
//   register  — does it draw as handed to you, or as the stage?
//               Default per §4: attached draws as a handout, own steps draw as
//               stage. There is no override until there is a column.
// ───────────────────────────────────────────────────────────────────────────
function attachedTo(slot) {
  // A parent that has been removed leaves the handout loose rather than hidden.
  // 006-register.sql says why: that is the failure a teacher can see and fix.
  if (slot.parent_slot_id && S.slots.some(s => s.id === slot.parent_slot_id)) {
    return slot.parent_slot_id;
  }
  const c = slot.condition;
  const t = c && c.show_if && c.show_if.slot;
  return (t && S.slots.some(s => s.id === t)) ? t : null;
}
function registerOf(slot, isAttached) {
  if (slot.register) return slot.register;                   // when the column exists
  return isAttached ? 'handout' : 'stage';
}

// Walk the ordered list once, hanging attached slots off their parent.
function outline() {
  const rows = [];
  const byParent = {};
  S.slots.forEach(s => {
    const p = attachedTo(s);
    if (p) (byParent[p] = byParent[p] || []).push(s);
  });
  let n = 0;
  S.slots.forEach(s => {
    if (attachedTo(s)) return;
    rows.push({ slot: s, number: ++n, attached: false, kids: byParent[s.id] || [] });
  });
  return rows;
}

function memberOf(slot) {
  if (slot.activity_id) {
    const a = S.acts[slot.activity_id];
    return { name: a ? a.name : 'Missing activity', kind: a ? a.kind : 'not readable' };
  }
  const q = S.seqs[slot.child_sequence_id];
  return { name: q ? q.name : 'Missing sequence', kind: q ? q.kind : 'not readable' };
}

function conditionLine(slot) {
  const c = slot.condition && slot.condition.show_if;
  if (!c) return '';
  return 'shown if that ' + esc(c.is || 'changes');
}

// ───────────────────────────────────────────────────────────────────────────
// Render
// ───────────────────────────────────────────────────────────────────────────
function render() {
  if (S.error) return screen('The database refused that', '<p>' + esc(S.error) + '</p>');

  if (!S.lessons.length) {
    return screen('No lessons here yet',
      '<p>The studio reads a lesson that already exists. Make one in the app — a sequence ' +
      'of kind <code>lesson</code> — and it will appear in the list at the top of this page.</p>' +
      '<p>You are on the <b>' + esc(vocabEnv(S.env).label) + '</b> database.</p>');
  }

  root.innerHTML =
    tabs() +
    '<div class="top">' + lessonPicker() + modes() + '</div>' +
    '<div class="body">' + spine() +
      (S.mode === 'preview' ? previewStage() : stage()) + corner() + '</div>' +
    deck();

  wire();
}

function tabs() {
  return '<div class="apptop">' +
    '<button class="apptab" disabled title="The canvas is its own window and is not built yet">Canvas</button>' +
    '<span class="apptab on">Studio — ' + esc(S.lesson ? S.lesson.name : '') + '</span>' +
  '</div>';
}

function lessonPicker() {
  if (S.lessons.length === 1) return '<span class="lesson">' + esc(S.lesson.name) + '</span>';
  return '<select id="pick" aria-label="Which lesson">' + S.lessons.map(l => {
    let label = l.name;
    if (l.kind && l.kind !== 'lesson') label += ' (' + l.kind + ')';
    if (l.master_id) label += ' — copy';
    return '<option value="' + esc(l.id) + '"' +
      (S.lesson && l.id === S.lesson.id ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('') + '</select>';
}

// Build · Preview · Record · Review over the same regions (§3). No Plan — the
// developer threw it out and §8 records that; frame 1's drawing still shows a
// Plan tab and is out of date on that one point.
function modes() {
  const m = (id, label, on, dis, title) =>
    '<button class="' + (on ? 'on' : 'off') + '" data-mode="' + id + '"' +
    (dis ? ' disabled' : '') + (title ? ' title="' + esc(title) + '"' : '') + '>' + label + '</button>';
  return '<div class="modes">' +
    m('build', 'Build', S.mode === 'build', false) +
    m('preview', 'Preview', S.mode === 'preview', false, 'Walk your own lesson as yourself.') +
    m('record', 'Record', S.mode === 'record', true, 'Takes are built after the canvas.') +
    m('review', 'Review', false, true, 'Reserved. Needs a cohort, and sharing does not exist yet.') +
  '</div>';
}

function spine() {
  const rows = outline();
  const body = rows.length
    ? rows.map(r => stepRow(r) + (r.kids.length
        ? '<div class="kids">' + r.kids.map(k => stepRow({ slot: k, attached: true })).join('') + '</div>'
        : '')).join('')
    : '<p class="cond">This lesson has no slots yet. Add something to it in the app and reload.</p>';

  return '<div class="pane">' +
    '<div class="lbl">The lesson</div>' +
    '<div class="spine">' + body + '</div>' +
    '<div class="panefoot"><button class="btn light wide" id="add">Add something</button></div>' +
  '</div>';
}

function stepRow(r) {
  const s = r.slot;
  const reg = registerOf(s, r.attached);
  const m = memberOf(s);
  const cls = [reg === 'handout' ? 'hand' : 'step'];
  if (s.id === S.hereSlot) cls.push('here');
  if (s.id === S.lookSlot) cls.push('looking');
  // dashed means authored but not yet shown to the learner (the mockup's key)
  if (S.mode === 'preview' && reg === 'handout' && !S.handed[s.id]) cls.push('ghost');
  const num = r.attached ? '' : '<span class="n">' + r.number + '</span>';
  const cond = r.attached ? '<span class="kind">' + conditionLine(s) + '</span>'
                          : '<span class="kind">' + esc(m.kind) + '</span>';
  return '<button class="' + cls.join(' ') + '" data-slot="' + esc(s.id) + '">' +
    num + '<span class="nm">' + esc(m.name) + '</span>' + cond + '</button>';
}


// ───────────────────────────────────────────────────────────────────────────
// Preview
//
// There is no student zone and none can be started — own-rows-only RLS on every
// table (route.md §12, proposal §10). So Preview is the teacher walking their
// own lesson as themselves. That is the honest version, not a stand-in, and the
// rows it writes are real rows.
//
// Three rules from §4 are enforced here and are the whole point of the mode:
//   - a handout never advances `progress`
//   - looking back never costs your position
//   - redoing writes a NEW attempt; 005 has no unique constraint on
//     learner-and-slot precisely so history survives a second go
// ───────────────────────────────────────────────────────────────────────────

async function loadAttempts(seqId) {
  S.att = {};
  const { data } = await S.sb.from('attempts')
    .select('slot_id,status,created_at').eq('sequence_id', seqId)
    .order('created_at', { ascending: true });
  // last one wins — the current state of this learner at this slot
  (data || []).forEach(a => { S.att[a.slot_id] = a.status; });
}

// Who sees this slot at all. Null condition means everyone.
function visible(slot) {
  const c = slot.condition && slot.condition.show_if;
  if (!c || !c.slot) return true;
  return S.att[c.slot] === c.is;
}

// What has to be true before you may pass. A gate that waits on a person cannot
// block (§10) — `pending` would strand you — so a blocking gate on a pending
// attempt is treated as open and says so rather than trapping you.
function gateHolds(slot) {
  const g = slot.gate;
  if (!g || !g.blocks) return null;
  const got = S.att[slot.id];
  if (got === g.satisfied_when) return null;
  if (got === 'pending') return null;
  return got ? 'This needs to be ' + esc(g.satisfied_when) + ' before moving on.'
             : 'Answer this before moving on.';
}

function steps() { return outline().filter(r => visible(r.slot)); }

function stepAt(slotId) {
  const rows = steps();
  const i = rows.findIndex(r => r.slot.id === slotId);
  return { rows, i };
}

// ── judging ────────────────────────────────────────────────────────────────
function judge(kind, content, given) {
  if (kind === 'mcq')       return given.picked === content.answer;
  if (kind === 'truefalse') return given.picked === (content.answer ? 0 : 1);
  if (kind === 'blank')     return String(given.typed || '').trim().toLowerCase()
                                 === String(content.answer || '').trim().toLowerCase();
  if (kind === 'order')     return (given.order || []).join('\u0001')
                                 === (content.items || []).join('\u0001');
  return null;                                   // video and display ask nothing
}

async function answer(slot, content, kind) {
  const given = S.live[slot.id] || {};
  const right = judge(kind, content, given);
  if (right === null) return;

  S.live[slot.id] = { ...given, judged: right ? 'passed' : 'failed' };

  // A new row every time. Never an update — the second go is a second row.
  const { error } = await S.sb.from('attempts').insert({
    sequence_id: S.lesson.id, slot_id: slot.id,
    status: right ? 'passed' : 'failed', detail: given
  });
  if (!error) S.att[slot.id] = right ? 'passed' : 'failed';
  render();
}

async function setProgress(slotId) {
  // progress has a unique index on (user_id, sequence_id), and user_id is
  // defaulted rather than sent, so upsert has nothing to match on. Read, then
  // write the row that is there.
  const { data: row } = await S.sb.from('progress')
    .select('id').eq('sequence_id', S.lesson.id).maybeSingle();
  if (row) await S.sb.from('progress').update({ slot_id: slotId }).eq('id', row.id);
  else     await S.sb.from('progress').insert({ sequence_id: S.lesson.id, slot_id: slotId });
  S.hereSlot = slotId;
}

// ── the live stage ─────────────────────────────────────────────────────────
function previewStage() {
  const rows = steps();
  if (S.finished) return finishStage(rows);
  if (!rows.length) {
    return '<div class="stage"><div class="look"></div><div class="paper"><div class="learner">' +
      '<p class="unknown">Nothing in this lesson is visible yet.</p></div></div></div>';
  }

  if (!S.hereSlot || !rows.some(r => r.slot.id === S.hereSlot)) S.hereSlot = rows[0].slot.id;
  if (!S.lookSlot || !S.slots.some(s => s.id === S.lookSlot)) S.lookSlot = S.hereSlot;

  const away = S.lookSlot !== S.hereSlot;
  const showing = S.slots.find(s => s.id === S.lookSlot);
  const cur = S.slots.find(s => s.id === S.hereSlot);
  const { i } = stepAt(S.hereSlot);

  const bar = away
    ? '<span>Looking back. Your place has not moved.</span>' +
      '<button class="btn light" id="back">Go back to where you are</button>'
    : '<span>Step ' + (i + 1) + ' of ' + rows.length + '.</span>';

  // the step itself, then anything handed out while you stay on it
  // A handout reveals itself at the moment it is given. Until then it is not on
  // the stage at all — that is what makes it a handout rather than a step that
  // happens to be indented. In Record the teacher's own gesture does this; here
  // the button in the corner stands in for it.
  const kids = (outline().find(r => r.slot.id === S.lookSlot) || {}).kids || [];
  let body = liveOne(showing, false);
  kids.filter(k => visible(k) && S.handed[k.id]).forEach(k => { body += liveOne(k, true); });

  const held = gateHolds(cur);
  const foot = away ? ''
    : '<div class="look">' +
        '<button class="btn light" id="prev"' + (i <= 0 ? ' disabled' : '') + '>Back</button>' +
        '<button class="btn light" id="next"' + (held ? ' disabled title="' + esc(held) + '"' : '') +
          ' style="background:var(--here);border-color:var(--here);color:#fff">' +
          (i >= rows.length - 1 ? 'Finish' : 'Next') + '</button>' +
        (held ? '<span>' + held + '</span>' : '') +
      '</div>';

  return '<div class="stage"><div class="look">' + bar + '</div>' +
    '<div class="paper"><div class="learner">' + body + '</div></div>' + foot + '</div>';
}


function finishStage(rows) {
  const ids = S.slots.map(s => s.id);
  let asked = 0, right = 0;
  ids.forEach(id => {
    const st = S.att[id];
    if (st === 'passed' || st === 'failed') { asked++; if (st === 'passed') right++; }
  });

  const line = asked
    ? right + ' of ' + asked + ' right.'
    : 'Nothing in this lesson asked you anything.';

  return '<div class="stage"><div class="look"><span>The end of the lesson.</span></div>' +
    '<div class="paper"><div class="learner">' +
      '<h1>' + esc(S.lesson.name) + '</h1>' +
      '<p>You walked ' + rows.length + (rows.length === 1 ? ' step' : ' steps') + '. ' + esc(line) + '</p>' +
      '<p class="after">Every answer above is a row that stayed. Walking it again ' +
      'writes new attempts beside the old ones rather than replacing them.</p>' +
    '</div></div>' +
    '<div class="look"><button class="btn light" id="restart" ' +
      'style="background:var(--here);border-color:var(--here);color:#fff">Walk it again</button>' +
      '<button class="btn light" id="tobuild">Back to building</button></div>' +
  '</div>';
}

function liveOne(slot, isHandout) {
  if (!slot) return '';
  const a = S.acts[slot.activity_id] || {};
  const c = (S.contentFor === slot.id ? S.content : S.live['c:' + slot.id]) || null;
  if (!c) { loadInto(slot); return '<p class="unknown">Reading…</p>'; }

  const K = KINDS[a.kind];
  const wrap = s => isHandout
    ? '<div style="border:1px solid var(--handline);background:#FDFBF6;border-radius:5px 5px 5px 0;' +
      'padding:14px 16px;margin:16px 0 0">' +
      '<p class="carries" style="margin:0 0 8px">Handed to you. Your place does not move.</p>' + s + '</div>'
    : s;

  if (!K) return wrap('<p class="unknown">This kind cannot be walked yet.</p>');

  const g = S.live[slot.id] || {};
  let out = (a.name && a.kind !== 'display' && !isHandout) ? '<h1>' + esc(a.name) + '</h1>' : '';
  out += liveBody(slot, a.kind, c, g);

  if (judge(a.kind, c, g) !== null || ['mcq','truefalse','blank','order'].indexOf(a.kind) >= 0) {
    if (g.judged) {
      out += '<p class="after"><b>' + (g.judged === 'passed' ? 'Right.' : 'Not quite.') + '</b> ' +
             '<button class="addopt" data-again="' + esc(slot.id) + '">Try it again</button></p>';
    } else {
      out += '<p class="after"><button class="btn light" data-check="' + esc(slot.id) + '">Check</button></p>';
    }
  }
  return wrap(out);
}

function liveBody(slot, kind, c, g) {
  const id = esc(slot.id);
  const done = !!g.judged;

  if (kind === 'mcq' || kind === 'truefalse') {
    const opts = kind === 'mcq' ? (c.options || []) : ['True', 'False'];
    const rightIdx = kind === 'mcq' ? c.answer : (c.answer ? 0 : 1);
    return '<p class="q">' + esc(c.ask) + '</p><ul class="opts">' + opts.map((o, n) => {
      let cls = '';
      if (done && n === rightIdx) cls = ' class="right"';
      const mark = g.picked === n ? 'background:#e7edf1;border-color:var(--here)' : '';
      return '<li' + cls + ' style="cursor:pointer;' + mark + '" data-pick="' + id + '" data-n="' + n + '">' +
        '<span class="bul"></span><span>' + esc(o) + '</span></li>';
    }).join('') + '</ul>';
  }

  if (kind === 'blank') {
    const bits = String(c.text || '').split('___');
    let out = '<p class="q">';
    bits.forEach((b, n) => {
      out += esc(b);
      if (n < bits.length - 1) {
        out += '<input class="inp" style="width:150px;display:inline-block" data-type="' + id + '" ' +
               'value="' + esc(g.typed || '') + '"' + (done ? ' disabled' : '') + '>';
      }
    });
    return out + '</p>';
  }

  if (kind === 'order') {
    const chosen = g.order || [];
    const left = (c.items || []).filter(x => chosen.indexOf(x) < 0);
    // shuffled once per slot, kept stable so it does not jump while you work
    if (!S.live['s:' + slot.id]) S.live['s:' + slot.id] = left.slice().sort(() => Math.random() - 0.5);
    const pool = S.live['s:' + slot.id].filter(x => chosen.indexOf(x) < 0);
    return '<p class="q">' + esc(c.ask) + '</p>' +
      '<ol class="ord">' + chosen.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>' +
      (pool.length ? '<p class="carries">Click them in order:</p><ul class="opts">' +
        pool.map(x => '<li style="cursor:pointer" data-take="' + id + '" data-v="' + esc(x) + '">' +
          '<span>' + esc(x) + '</span></li>').join('') + '</ul>' : '') +
      (chosen.length ? '<p class="after"><button class="addopt" data-clear="' + id + '">Start over</button></p>' : '');
  }

  if (kind === 'video') return KINDS.video.draw(c);
  return KINDS.display.draw(c);
}

// content for a slot that is not the selected one — handouts need theirs too
async function loadInto(slot) {
  if (!slot.activity_id || S.live['loading:' + slot.id]) return;
  S.live['loading:' + slot.id] = true;
  const { data } = await S.sb.from('activities').select('content').eq('id', slot.activity_id).maybeSingle();
  S.live['c:' + slot.id] = data ? data.content : {};
  render();
}

function wirePreview() {
  const $ = id => document.getElementById(id);
  const set = (slotId, patch) => {
    S.live[slotId] = { ...(S.live[slotId] || {}), ...patch };
  };

  root.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-pick');
    if ((S.live[id] || {}).judged) return;
    set(id, { picked: +el.getAttribute('data-n') });
    render();
  });

  root.querySelectorAll('[data-take]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-take');
    const cur = (S.live[id] || {}).order || [];
    set(id, { order: cur.concat([el.getAttribute('data-v')]) });
    render();
  });

  root.querySelectorAll('[data-clear]').forEach(el => el.onclick = () => {
    set(el.getAttribute('data-clear'), { order: [] });
    render();
  });

  root.querySelectorAll('[data-type]').forEach(el => el.oninput = () => {
    set(el.getAttribute('data-type'), { typed: el.value });
  });

  root.querySelectorAll('[data-check]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-check');
    const slot = S.slots.find(s => s.id === id);
    const a = S.acts[slot.activity_id] || {};
    const c = (S.contentFor === id ? S.content : S.live['c:' + id]) || {};
    answer(slot, c, a.kind);
  });

  // Redoing writes a new attempt — so clearing the local state is all this does.
  root.querySelectorAll('[data-again]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-again');
    S.live[id] = {};
    delete S.live['s:' + id];
    render();
  });

  if ($('next')) $('next').onclick = async () => {
    const { rows, i } = stepAt(S.hereSlot);
    if (i >= rows.length - 1) { S.finished = true; render(); return; }
    const to = rows[i + 1];
    if (!to) return;
    await setProgress(to.slot.id);
    S.lookSlot = to.slot.id;
    await loadContent(S.lookSlot);
    render();
  };
  if ($('restart')) $('restart').onclick = async () => {
    S.finished = false; S.live = {}; S.handed = {};
    const rows = steps();
    if (rows[0]) { await setProgress(rows[0].slot.id); S.lookSlot = rows[0].slot.id; await loadContent(S.lookSlot); }
    render();
  };
  if ($('tobuild')) $('tobuild').onclick = () => { S.finished = false; S.mode = 'build'; render(); };

  root.querySelectorAll('[data-hand]').forEach(el => el.onclick = async () => {
    const id = el.getAttribute('data-hand');
    S.handed[id] = true;
    render();
  });

  if ($('prev')) $('prev').onclick = async () => {
    const { rows, i } = stepAt(S.hereSlot);
    const to = rows[Math.max(i - 1, 0)];
    if (!to) return;
    await setProgress(to.slot.id);
    S.lookSlot = to.slot.id;
    await loadContent(S.lookSlot);
    render();
  };
}

function stage() {
  const looking = S.slots.find(s => s.id === S.lookSlot);
  const away = S.hereSlot && S.lookSlot && S.hereSlot !== S.lookSlot;

  let bar = '';
  if (S.has006 === false) {
    return '<div class="stage"><div class="look"><span>' +
      '<b>006-register.sql has not been run on this database.</b> ' +
      'Handouts are turned off until it has — everything added lands as a step.' +
      '</span></div>' +
      '<div class="paper"><div class="learner">' + paper(looking) + '</div></div>' + rack() + '</div>';
  }
  if (away) {
    const here = S.slots.find(s => s.id === S.hereSlot);
    bar = '<span>Looking at <b>' + esc(memberOf(looking).name) + '</b>. ' +
          'The learner is at <b>' + esc(here ? memberOf(here).name : 'a slot that has gone') + '</b>.</span>' +
          '<button class="btn light" id="back">Go back to where you are</button>';
  } else if (looking) {
    bar = '<span>Where the learner is.</span>';
  }

  return '<div class="stage">' +
    '<div class="look">' + bar + '</div>' +
    '<div class="paper"><div class="learner">' + paper(looking) + '</div></div>' +
    editBar() +
    rack() +
  '</div>';
}

function paper(slot) {
  if (!slot) return '<p class="unknown">Nothing selected.</p>';
  if (slot.child_sequence_id) {
    const q = S.seqs[slot.child_sequence_id];
    return '<p class="unknown">This step is another sequence — ' +
      esc(q ? q.name : 'not readable') + '. Opening one inside the studio is not built yet.</p>';
  }
  if (S.contentErr) return '<p class="unknown">That activity would not load: ' + esc(S.contentErr) + '</p>';
  if (S.contentFor !== slot.id) return '<p class="unknown">Reading…</p>';

  const a = S.acts[slot.activity_id] || {};
  const c = S.content || {};

  // A kind the rack makes draws itself. Everything else falls through to the
  // older guesswork below, which is what the scaffolding's activities need.
  const K = KINDS[a.kind];
  if (K) {
    return (a.name && a.kind !== 'display' ? '<h1>' + esc(a.name) + '</h1>' : '') + K.draw(c);
  }

  let out = '';

  if (a.kind === 'video' || c.video_id || c.video) {
    // §10: a video activity does not play its own video. Only the walkthrough's
    // player is real. Saying so is better than a dead play button.
    out += '<div class="vid">A video activity does not play its own video yet.<br>' +
           'Only the walkthrough\'s player is real.</div>';
  }
  if (a.name) out += '<h1>' + esc(a.name) + '</h1>';

  const text = c.html || c.text || c.body || (Array.isArray(c.paragraphs) ? c.paragraphs.join('\n\n') : null);
  if (typeof text === 'string' && text.trim()) {
    // Text only. Nothing here trusts stored markup enough to inject it.
    out += text.split(/\n\s*\n/).map(p => '<p>' + esc(p.trim()) + '</p>').join('');
    return out;
  }

  const keys = Object.keys(c);
  if (!keys.length) {
    out += '<p class="unknown">This activity has no content stored.</p>';
    return out;
  }
  out += '<p class="unknown">The studio does not know how to lay out a <b>' + esc(a.kind || 'this') +
         '</b> activity yet, so here is what it holds. Tell me the shape of one and it will render properly.</p>' +
         '<div class="raw">' + esc(JSON.stringify(c, null, 2).slice(0, 4000)) + '</div>';
  return out;
}


// The teacher's own gesture, standing in for itself. In Record this is the real
// thing and it lands at a time in the take; here it just reveals the card.
function handOutList() {
  if (S.mode !== 'preview' || S.finished) return '';
  const row = outline().find(r => r.slot.id === S.lookSlot);
  const kids = ((row && row.kids) || []).filter(visible);
  if (!kids.length) return '';

  return '<div class="lbl">To hand out</div>' +
    kids.map(k => {
      const n = memberOf(k).name;
      return S.handed[k.id]
        ? '<div class="act"><span class="t">given</span><b>' + esc(n) + '</b></div>'
        : '<div style="padding:0 10px 7px"><button class="btn wide" data-hand="' + esc(k.id) + '">' +
          'Hand out ' + esc(n) + '</button></div>';
    }).join('') +
    '<div class="none">Handing something out does not move anyone on.</div>';
}


// ───────────────────────────────────────────────────────────────────────────
// Changing what is already there
//
// Four operations, all on the slot you are looking at: edit it, move it, change
// whether it is a step or a handout, take it out.
//
// The register control is the one frame 2 promised: "handout or step is decided
// at the moment of adding... changing it later is one control in the inspector."
// This is that control. There is no inspector yet, so it lives on the stage.
// ───────────────────────────────────────────────────────────────────────────

// Positions are rewritten freely; slot ids never are. Everything that points at
// a slot — attempts, conditions, recorded actions — points at the id, so this
// renumbering changes where things sit and nothing about what anything means.
async function renumber(ordered) {
  for (let i = 0; i < ordered.length; i++) {
    if (ordered[i].position !== i + 1) {
      await S.sb.from('slots').update({ position: i + 1 }).eq('id', ordered[i].id);
    }
  }
}

// A step travels with its handouts. Moving one without them would be a move
// that silently rearranges someone else's lesson.
function flatWithKids() {
  const out = [];
  outline().forEach(r => { out.push(r.slot); r.kids.forEach(k => out.push(k)); });
  return out;
}

async function moveStep(slotId, dir) {
  const rows = outline();
  const i = rows.findIndex(r => r.slot.id === slotId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= rows.length) return;
  const moved = rows.slice();
  moved.splice(j, 0, moved.splice(i, 1)[0]);

  const flat = [];
  moved.forEach(r => { flat.push(r.slot); r.kids.forEach(k => flat.push(k)); });
  await renumber(flat);
  await openLesson(S.lesson.id);
  S.lookSlot = slotId;
  await loadContent(slotId);
  render();
}

async function setRegister(slotId, want) {
  const slot = S.slots.find(s => s.id === slotId);
  if (!slot) return;

  if (want === 'handout') {
    // It hangs under the nearest step above it. Without one there is nothing to
    // be handed out during, so the first thing in a lesson cannot be a handout.
    const rows = outline();
    const i = rows.findIndex(r => r.slot.id === slotId);
    if (i <= 0) { S.error = null; S.note = 'Nothing above this to hand it out during.'; return render(); }
    await S.sb.from('slots')
      .update({ register: 'handout', parent_slot_id: rows[i - 1].slot.id }).eq('id', slotId);
  } else {
    await S.sb.from('slots')
      .update({ register: 'stage', parent_slot_id: null }).eq('id', slotId);
  }
  await openLesson(S.lesson.id);
  S.lookSlot = slotId;
  await loadContent(slotId);
  render();
}

// Soft delete, which is what 002-slots-soft-delete.sql is for. The activity
// itself is untouched — taking something out of one lesson must not destroy it
// in the others that use it (§7).
async function removeSlot(slotId) {
  await S.sb.from('slots').update({ deleted_at: new Date().toISOString() }).eq('id', slotId);
  await openLesson(S.lesson.id);
  render();
}

function editBar() {
  if (S.mode !== 'build') return '';
  const slot = S.slots.find(s => s.id === S.lookSlot);
  if (!slot) return '';
  const a = S.acts[slot.activity_id] || {};
  const known = !!KINDS[a.kind];
  const reg = registerOf(slot, !!attachedTo(slot));
  const rows = outline();
  const i = rows.findIndex(r => r.slot.id === S.lookSlot);
  const isStep = i >= 0;

  return '<div class="look" style="border-top:1px solid var(--line);padding-top:9px">' +
    '<button class="btn light" id="edit"' + (known ? '' : ' disabled title="The rack did not make this one"') +
      '>Edit</button>' +
    (isStep ? '<button class="btn light" id="up"' + (i <= 0 ? ' disabled' : '') + '>Move up</button>' +
              '<button class="btn light" id="down"' + (i >= rows.length - 1 ? ' disabled' : '') +
              '>Move down</button>' : '') +
    '<button class="btn light" id="reg">' +
      (reg === 'handout' ? 'Make it a step' : 'Make it a handout') + '</button>' +
    '<div style="flex:1"></div>' +
    (S.note ? '<span>' + esc(S.note) + '</span>' : '') +
    '<button class="btn light" id="rm">' + (S.confirmRm === slot.id ? 'Really remove it' : 'Remove') +
    '</button>' +
  '</div>';
}

function wireEdit() {
  const $ = id => document.getElementById(id);
  const slot = S.slots.find(s => s.id === S.lookSlot);
  if (!slot) return;

  if ($('edit')) $('edit').onclick = () => {
    const a = S.acts[slot.activity_id] || {};
    S.rack = { kind: a.kind, content: S.content || KINDS[a.kind].blank(), editing: slot.id };
    S.rackErr = null; S.note = null;
    render();
  };
  if ($('up')) $('up').onclick = () => moveStep(slot.id, -1);
  if ($('down')) $('down').onclick = () => moveStep(slot.id, 1);
  if ($('reg')) $('reg').onclick = () => {
    S.note = null;
    setRegister(slot.id, attachedTo(slot) ? 'stage' : 'handout');
  };
  if ($('rm')) $('rm').onclick = () => {
    if (S.confirmRm === slot.id) { S.confirmRm = null; removeSlot(slot.id); }
    else { S.confirmRm = slot.id; render(); }
  };
}

function corner() {
  const vids = S.slots.map(s => S.acts[s.activity_id])
    .filter(a => a && (a.kind === 'video' || a.kind === 'audio'));

  const media = vids.length
    ? vids.map(v => '<div class="box">' + esc(v.name) + '<br><span style="color:#8B939B">' +
        esc(v.kind) + '</span></div>').join('')
    : '<div class="none">No media in this lesson.</div>';

  const takes = S.takes.length
    ? S.takes.map(t => '<div class="act"><span class="t">' + t.clips + '</span><b>' +
        esc(t.name) + '</b></div>').join('') +
      '<div class="none">Clip counts, not lengths. A take\'s clock is the sum of its ' +
      'clips and must never be wall-clock — the lengths live in each clip\'s media, ' +
      'whose shape is not settled.</div>'
    : '<div class="none">No takes yet.</div>';

  return '<div class="auto">' +
    '<div class="lbl">Teacher\'s corner</div>' +
    handOutList() +
    '<div class="cam">your camera</div>' +
    media +
    '<div class="lbl">Takes</div>' + takes +
    '<div class="autofoot"><button class="btn wide" disabled ' +
      'title="Recording comes after the canvas">Start recording</button></div>' +
  '</div>';
}

// The deck exists only when there is a clock. At rest there is none.
function deck() {
  if (!S.openTake) return '';
  return '<div class="deck"><button class="btn">Play</button>' +
    '<span class="clock">0:00</span>' +
    '<div class="track"><u></u><i></i></div></div>';
}


// ───────────────────────────────────────────────────────────────────────────
// The rack, drawn
//
// Two screens: pick a kind, then fill it in. The footer is where step-or-
// handout is decided — at the moment of adding, while you still know which you
// meant (frame 2's verdict). Changing it later is one control, and that control
// does not exist yet.
// ───────────────────────────────────────────────────────────────────────────
function rack() {
  if (!S.rack) return '';
  const K = KINDS[S.rack.kind];

  if (!K) {
    return '<div class="scrim"></div><div class="panel">' +
      '<div class="phead"><span>Add something</span><div style="flex:1"></div>' +
      '<button class="btn light" id="rclose">Close</button></div>' +
      '<div class="pbody"><div class="kinds">' +
        KIND_ORDER.map(k => '<button class="kindbtn" data-kind="' + k + '"><b>' +
          esc(KINDS[k].label) + '</b><span>' + esc(KINDS[k].hint) + '</span></button>').join('') +
      '</div></div>' +
      '<div class="pfoot"><span>Six kinds and no more. Anything bigger gets made on the canvas.</span></div>' +
    '</div>';
  }

  const looking = S.slots.find(s => s.id === S.lookSlot);
  const host = looking ? memberOf(looking).name : null;

  return '<div class="scrim"></div><div class="panel">' +
    '<div class="phead"><span>New ' + esc(K.label.toLowerCase()) + '</span>' +
    '<div style="flex:1"></div>' +
    (S.rack.editing ? '' : '<button class="btn light" id="rback">Pick another kind</button>') +
    '<button class="btn light" id="rclose">Cancel</button></div>' +
    '<div class="pbody"><div class="form" id="rform">' +
      (S.rackErr ? '<p class="err">' + esc(S.rackErr) + '</p>' : '') +
      K.form(S.rack.content) +
    '</div></div>' +
    '<div class="pfoot">' +
      (S.rack.editing
        ? '<span>Changing this changes it everywhere it is used.</span>' +
          '<div style="flex:1"></div>' +
          '<button class="btn light" id="assave" ' +
            'style="background:var(--here);border-color:var(--here);color:#fff">Save changes</button>'
        : '<span>' + (host
            ? 'A handout hangs under <b>' + esc(host) + '</b> and does not move the learner on. A step does.'
            : 'A step moves the learner on. A handout does not.') + '</span>' +
          '<div style="flex:1"></div>' +
          '<button class="btn light" id="ashand"' +
            (host && S.has006 ? '' : ' disabled') +
            (!S.has006 ? ' title="Needs 006-register.sql. Run it and reload."' : '') +
            '>Add as a handout</button>' +
          '<button class="btn light" id="asstep" ' +
            'style="background:var(--here);border-color:var(--here);color:#fff">Add as a step</button>') +
    '</div>' +
  '</div>';
}

function wireRack() {
  if (!S.rack) return;
  const $ = id => document.getElementById(id);
  const close = () => { S.rack = null; S.rackErr = null; render(); };

  if ($('rclose')) $('rclose').onclick = close;
  if ($('rback')) $('rback').onclick = () => { S.rack = { kind:null }; S.rackErr = null; render(); };

  root.querySelectorAll('[data-kind]').forEach(b => {
    b.onclick = () => {
      const k = b.getAttribute('data-kind');
      S.rack = { kind: k, content: KINDS[k].blank() };
      S.rackErr = null;
      render();
    };
  });

  // Rows are added and removed in the DOM rather than by re-rendering, so
  // nothing you have typed is lost and the cursor stays where it was.
  const opts = $('opts');
  if ($('addopt') && opts) $('addopt').onclick = () => {
    const n = opts.querySelectorAll('.opt').length;
    const row = document.createElement('div');
    row.className = 'opt';
    row.innerHTML = '<input type="radio" name="right" value="' + n + '" aria-label="This one is right">' +
      '<input class="inp" data-opt>' +
      '<button class="drop" data-dropopt title="Remove this answer">&times;</button>';
    opts.appendChild(row);
    row.querySelector('[data-opt]').focus();
    wireDrops();
  };
  if ($('additem') && opts) $('additem').onclick = () => {
    const row = document.createElement('div');
    row.className = 'opt';
    row.innerHTML = '<input class="inp" data-item>' +
      '<button class="drop" data-dropopt title="Remove this line">&times;</button>';
    opts.appendChild(row);
    row.querySelector('[data-item]').focus();
    wireDrops();
  };
  wireDrops();

  if ($('assave')) $('assave').onclick = () => saveEdit();
  if ($('asstep')) $('asstep').onclick = () => save('stage');
  if ($('ashand')) $('ashand').onclick = () => save('handout');
}

function wireDrops() {
  root.querySelectorAll('[data-dropopt]').forEach(b => {
    b.onclick = () => {
      const box = document.getElementById('opts');
      if (box && box.querySelectorAll('.opt').length > 2) {
        b.closest('.opt').remove();
        // renumber the radios so "which one is right" still means something
        [...box.querySelectorAll('input[type=radio]')].forEach((r, i) => { r.value = i; });
      }
    };
  });
}

// ───────────────────────────────────────────────────────────────────────────
// Saving
//
// Two rows: the activity (what it is) and the slot (where it sits in THIS
// lesson). Register lives on the slot, never on the activity — the same
// question is a step in one lesson and a handout in another (006-register.sql).
// ───────────────────────────────────────────────────────────────────────────

// Editing changes the activity, not the placement. The same activity may sit in
// several lessons, which is why the footer says so — this is the un-linked half
// of §7, and the linked-copy machinery is not built.
async function saveEdit() {
  if (S.saving || !S.rack || !S.rack.editing) return;
  const K = KINDS[S.rack.kind];
  const content = K.read(document.getElementById('rform'));
  const complaint = K.check(content);
  if (complaint) { S.rack.content = content; S.rackErr = complaint; render(); return; }

  const slot = S.slots.find(s => s.id === S.rack.editing);
  if (!slot) { S.rack = null; return render(); }

  let name = String(K.name(content) || '').replace(/\s+/g, ' ').trim();
  if (name.length > 70) name = name.slice(0, 67) + '…';
  if (!name) name = K.label;

  S.saving = true;
  const { error } = await S.sb.from('activities')
    .update({ name, content }).eq('id', slot.activity_id);
  S.saving = false;
  if (error) { S.rack.content = content; S.rackErr = error.message; render(); return; }

  S.rack = null;
  await openLesson(S.lesson.id);
  S.lookSlot = slot.id;
  await loadContent(slot.id);
  render();
}

async function save(register) {
  if (S.saving || !S.rack || !S.lesson) return;
  const K = KINDS[S.rack.kind];
  const form = document.getElementById('rform');
  const content = K.read(form);

  const complaint = K.check(content);
  if (complaint) { S.rack.content = content; S.rackErr = complaint; render(); return; }

  S.saving = true;
  S.rackErr = null;

  let name = String(K.name(content) || '').replace(/\s+/g, ' ').trim();
  if (name.length > 70) name = name.slice(0, 67) + '…';
  if (!name) name = KINDS[S.rack.kind].label;

  const { data: act, error: e1 } = await S.sb.from('activities')
    .insert({ name, kind: S.rack.kind, content }).select('id').single();
  if (e1) { S.saving = false; S.rack.content = content; S.rackErr = e1.message; render(); return; }

  // Where it goes. A handout hangs under whatever you are looking at — or under
  // that thing's own parent, because a handout on a handout is not a shape the
  // design has.
  let parent = null;
  if (register === 'handout') {
    const looking = S.slots.find(s => s.id === S.lookSlot);
    parent = looking ? (attachedTo(looking) || looking.id) : null;
  }
  const last = S.slots.reduce((m, s) => Math.max(m, s.position || 0), 0);

  const row = { sequence_id: S.lesson.id, activity_id: act.id, position: last + 1 };
  // register and parent_slot_id arrive with 006. Without them a handout has
  // nowhere to record that it IS one, and saving it anyway makes a step wearing
  // a handout's name. So the page refuses instead of quietly changing what you
  // asked for. A step needs neither column and saves either way.
  if (S.has006) { row.register = register; row.parent_slot_id = parent; }

  let { data: slot, error: e2 } = await S.sb.from('slots').insert(row).select('id').single();
  S.saving = false;
  if (e2) { S.rack.content = content; S.rackErr = e2.message; render(); return; }

  S.rack = null;
  await openLesson(S.lesson.id);
  if (slot) { S.lookSlot = slot.id; await loadContent(S.lookSlot); }
  render();
}

function wire() {
  const pick = document.getElementById('pick');
  if (pick) pick.onchange = async e => {
    const id = e.target.value;
    screen('Opening', '<p>Reading the lesson.</p>');
    await openLesson(id);
    history.replaceState(null, '', '?lesson=' + id);
    render();
  };

  // Clicking a slot moves your gaze and nothing else. Browsing your own lesson
  // never costs your position (§4) — nothing here writes to `progress`.
  root.querySelectorAll('[data-slot]').forEach(el => {
    if (S.rack) { el.disabled = true; return; }
    el.onclick = async () => {
      S.lookSlot = el.getAttribute('data-slot');
      S.note = null; S.confirmRm = null;
      render();
      await loadContent(S.lookSlot);
      render();
    };
  });

  const back = document.getElementById('back');
  if (back) back.onclick = async () => {
    S.lookSlot = S.hereSlot;
    render();
    await loadContent(S.lookSlot);
    render();
  };

  root.querySelectorAll('[data-mode]').forEach(el => {
    el.onclick = () => { S.mode = el.getAttribute('data-mode'); render(); };
  });

  const add = document.getElementById('add');
  if (add) add.onclick = () => { S.rack = { kind: null }; S.rackErr = null; render(); };

  wireRack();
  if (S.mode === 'preview') wirePreview();
  else if (!S.rack) wireEdit();
}
</script>
