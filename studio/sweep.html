<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leftover video</title>

<!--
  sweep.html — lives at website/studio/sweep.html
  Address: https://t-dev-il.github.io/vocabco/studio/sweep.html

  FIX-010. studio-build-log.md §5: "Storage still leaks in every case but one.
  Deleting a take from the corner removes its files. Deleting a recording any
  other way, or a sequence, cascades the rows and leaves the objects. Storage
  has no foreign keys; this needs a trigger or a sweep and neither is written."

  This is the sweep.

  WHY A SWEEP AND NOT A TRIGGER

  A trigger would have to delete from `storage.objects` in SQL. Removing that
  row does not reliably remove the stored bytes — the file becomes invisible to
  the API and stays in the store, which converts a leak you can see into a leak
  you cannot. The storage API is the only thing that removes both, and it is
  reachable from a page and not from a trigger.

  A sweep is also the safer shape for a thing that deletes video. It reads
  first, shows exactly what it found, and removes nothing until asked. A trigger
  fires in the dark.

  WHAT COUNTS AS ORPHANED

  007-takes-bucket.sql: every file is `<user_id>/<recording_id>/<clip_id>.webm`.
  So a file is orphaned when NO `clips` row with that id exists — not when the
  clip is soft-deleted. A soft-deleted clip still has a row, and a row that
  exists is a row somebody might yet restore; taking its footage away would make
  that restoration a lie. Cascade-deleted rows leave no row at all, and those
  are exactly the ones this finds.

  Contractor 08, 2026-09-12.
-->

<style>
  :root{--rail:#EDEEEA; --ink:#1B1E21; --dim:#6B7178; --line:#D9DBD5; --here:#0F5D8C}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--rail); color:var(--ink); overflow:hidden;
       font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  /* The column lives here, not on body — the same fault that hid the canvas's
     bottom bar and stranded the studio at the foot of a long lesson. */
  #root{height:100%; display:flex; flex-direction:column; overflow:hidden; min-height:0}

  .top{flex:0 0 44px; background:#fff; border-bottom:1px solid var(--line);
       display:flex; align-items:center; gap:10px; padding:0 14px}
  .title{font-weight:650; font-size:14px}
  .build{font-size:10.5px; color:#9b9e96}
  .wrap{flex:1; overflow-y:auto; padding:20px 16px; min-height:0}
  .card{max-width:76ch; margin:0 auto 14px; background:#fff; border:1px solid var(--line);
        border-radius:9px; padding:18px 20px; line-height:1.6}
  h2{font-size:15px; margin:0 0 8px; font-weight:650}
  p{margin:0 0 10px; font-size:13.5px; color:var(--dim)}
  b{color:var(--ink)}
  .btn{border:1px solid var(--line); background:#fff; border-radius:5px; padding:6px 12px;
       font:13px inherit; font-family:inherit; color:var(--ink); cursor:pointer}
  .btn.dark{background:#31363C; border-color:#4A5158; color:#E8EAEC}
  .btn.danger{background:#8a2d2d; border-color:#8a2d2d; color:#fff}
  .btn[disabled]{opacity:.45; cursor:not-allowed}
  .row{display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap}
  .list{margin-top:12px; border:1px solid var(--line); border-radius:6px; max-height:320px;
        overflow-y:auto; background:#FBFAF6}
  .f{display:flex; gap:10px; padding:6px 10px; border-bottom:1px solid #EFEDE5;
     font:11.5px ui-monospace,Menlo,monospace}
  .f:last-child{border-bottom:0}
  .f .sz{margin-left:auto; color:var(--dim); white-space:nowrap}
  .keep{color:#3f7a3f}
  .err{color:#8a2d2d}
  code{font:12px ui-monospace,Menlo,monospace; background:#F2F3EF; padding:1px 4px; border-radius:3px}
</style>
</head>
<body>
<div id="root"><div class="wrap"><div class="card"><h2>Opening</h2>
<p>Reading the bucket.</p></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const BUILD = 'sweep 2';
const BUCKET = 'takes';

const S = { sb: null, env: 'live', uid: null, found: null, keep: 0, busy: false,
            err: null, done: null, log: [] };

const root = document.getElementById('root');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const mb = n => (n / 1048576).toFixed(1) + ' MB';

function shell(inner) {
  root.innerHTML =
    '<div class="top"><span class="title">Leftover video</span>' +
      '<span class="build">' + BUILD + '</span>' +
      '<div style="flex:1"></div>' +
      '<button class="btn" id="back">Back to the studio</button></div>' +
    '<div class="wrap">' + inner + '</div>';
  const b = document.getElementById('back');
  if (b) b.onclick = () => location.href = 'studio.html';
}

function card(title, html) { shell('<div class="card"><h2>' + esc(title) + '</h2>' + html + '</div>'); }

function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => no(new Error(src));
    document.head.appendChild(s);
  });
}

(async function boot() {
  try { await loadScript('../config.js'); }
  catch (e) { try { await loadScript('config.js'); }
    catch (e2) { return card('config.js is not where this page looked',
      '<p>It tried <code>../config.js</code> and <code>config.js</code>.</p>'); } }

  try { S.env = localStorage.getItem('vocabEnv') || 'live'; } catch (e) {}
  const env = vocabEnv(S.env);
  S.env = env.name;

  if (!window.supabase || !supabase.createClient) {
    return card('The database library did not load', '<p>Check the connection and reload.</p>');
  }
  S.sb = supabase.createClient(env.url, env.anon, {
    auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true }
  });
  vocabEnvBanner(S.env, () => {});

  const { data: { session } } = await S.sb.auth.getSession();
  if (!session) {
    return card('Sign in on the main app first',
      '<p>This page uses the session the app already holds.</p>' +
      '<p>You are pointed at the <b>' + esc(env.label) + '</b> database.</p>');
  }
  S.uid = session.user.id;
  S.envLabel = env.label;
  draw();
})().catch(e => card('The sweep stopped', '<p>' + esc(e && e.message || e) + '</p>'));

function draw() {
  // Everything this function draws needs wiring at the bottom, so NOTHING here
  // returns early. An early return on the first screen is why the button sat
  // there doing nothing: it was drawn and then never connected.
  if (S.found === null) {
    card('Nothing has been looked at yet',
      '<p>When you record a take, the video is saved as a file. If you later delete ' +
      'that take or the lesson it belonged to, the video file is <b>not</b> deleted with ' +
      'it — it stays where it is, using up space, belonging to nothing.</p>' +
      '<p>This page finds those leftover videos and tells you how much room they are ' +
      'taking. Looking changes nothing. Nothing is deleted unless you press the red ' +
      'button afterwards.</p>' +
      '<p>You are on the <b>' + esc(S.envLabel) + '</b> database.</p>' +
      '<div class="row"><button class="btn dark" id="look"' + (S.busy ? ' disabled' : '') + '>' +
        (S.busy ? 'Looking\u2026' : 'Look in the bucket') + '</button>' +
        (S.err ? '<span class="err">' + esc(S.err) + '</span>' : '') + '</div>');
    wire();
    return;
  }

  const total = S.found.reduce((n, f) => n + (f.size || 0), 0);
  card(S.found.length ? 'Found ' + S.found.length + ' leftover video' +
       (S.found.length === 1 ? '' : 's') : 'Nothing to clear out',
    (S.found.length
      ? '<p>These videos no longer belong to any take. Together they are taking up ' +
        '<b>' + mb(total) + '</b>. <span class="keep">' + S.keep + ' other video' +
        (S.keep === 1 ? '' : 's') + ' still belong to a take and will not be touched.</span></p>' +
        '<div class="list">' + S.found.map(f =>
          '<div class="f"><span>' + esc(f.name) + '</span>' +
          '<span class="sz">' + mb(f.size || 0) + '</span></div>').join('') + '</div>' +
        '<div class="row">' +
          '<button class="btn danger" id="go"' + (S.busy ? ' disabled' : '') + '>' +
            (S.busy ? 'Deleting\u2026' : 'Delete these ' + S.found.length) + '</button>' +
          '<button class="btn" id="again">Look again</button>' +
          (S.done ? '<span>' + esc(S.done) + '</span>' : '') +
          (S.err ? '<span class="err">' + esc(S.err) + '</span>' : '') +
        '</div>'
      : '<p>Every video you have still belongs to a take. Nothing is going to waste. ' +
        '<span class="keep">' + S.keep + ' video' + (S.keep === 1 ? '' : 's') + ' checked.</span></p>' +
        (S.done ? '<p>' + esc(S.done) + '</p>' : '') +
        '<div class="row"><button class="btn" id="again">Look again</button></div>'));

  wire();
}

function wire() {
  const look = document.getElementById('look');
  if (look) look.onclick = sweep;
  const again = document.getElementById('again');
  if (again) again.onclick = sweep;
  const go = document.getElementById('go');
  if (go) go.onclick = remove;
}

// ── looking ────────────────────────────────────────────────────────────────
// Two levels, because that is the shape 007 laid down: recording folders under
// the user id, clip files under those. Paged, because .list() caps at 100 by
// default and a teacher who records every lesson will pass that inside a term.
async function listAll(prefix) {
  const out = [];
  for (let page = 0; page < 40; page++) {
    const { data, error } = await S.sb.storage.from(BUCKET)
      .list(prefix, { limit: 100, offset: page * 100, sortBy: { column: 'name', order: 'asc' } });
    if (error) throw new Error(error.message);
    if (!data || !data.length) break;
    data.forEach(d => out.push(d));
    if (data.length < 100) break;
  }
  return out;
}

async function sweep() {
  S.busy = true; S.err = null; S.done = null; draw();
  try {
    // Every clip id that exists at all, soft-deleted included. A row that
    // exists is a row somebody might restore.
    const { data: clips, error } = await S.sb.from('clips').select('id');
    if (error) throw new Error(error.message);
    const live = new Set((clips || []).map(c => c.id));

    const folders = await listAll(S.uid);
    const orphans = [];
    let keep = 0;

    for (const f of folders) {
      // A folder comes back with no id of its own. Anything else at this level
      // is a stray file directly under the user id, which 007's path shape does
      // not produce — so it belongs to no clip either.
      if (f.id) {
        orphans.push({ name: S.uid + '/' + f.name, size: (f.metadata && f.metadata.size) || 0 });
        continue;
      }
      const files = await listAll(S.uid + '/' + f.name);
      for (const file of files) {
        const clipId = file.name.replace(/\.[a-z0-9]+$/i, '');
        const path = S.uid + '/' + f.name + '/' + file.name;
        if (live.has(clipId)) keep++;
        else orphans.push({ name: path, size: (file.metadata && file.metadata.size) || 0 });
      }
    }

    S.found = orphans;
    S.keep = keep;
  } catch (e) {
    S.err = e.message || String(e);
    S.found = S.found || null;
  }
  S.busy = false;
  draw();
}

// ── removing ───────────────────────────────────────────────────────────────
// Only the exact paths on screen, in batches, and then it looks again so the
// page never claims an outcome it has not re-read.
async function remove() {
  if (!S.found || !S.found.length) return;
  if (!confirm('Delete ' + S.found.length + ' leftover video' +
               (S.found.length === 1 ? '' : 's') + ' for good? This cannot be undone.')) return;

  S.busy = true; S.err = null; draw();
  const paths = S.found.map(f => f.name);
  let gone = 0;
  try {
    for (let i = 0; i < paths.length; i += 50) {
      const batch = paths.slice(i, i + 50);
      const { error } = await S.sb.storage.from(BUCKET).remove(batch);
      if (error) throw new Error(error.message);
      gone += batch.length;
    }
  } catch (e) {
    S.err = e.message || String(e);
  }
  S.busy = false;
  S.done = 'Deleted ' + gone + ' video' + (gone === 1 ? '' : 's') + '.';
  await sweep();
}
</script>
</body>
</html>
