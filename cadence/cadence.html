<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence</title>
<!-- cadence.html · 2026-11-09e · Contractor 20, Clean up by Contractor 22. Cadence, the new reader on timed text.
     Two ways to watch: the reader (video docked or floating over the text) and
     full screen with subtitles. app.js is untouched. Reads only; writes nothing. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cadence.css">
<style>.cd-fake{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfd8c6;font:600 15px/1.5 Inter,system-ui,sans-serif;background:radial-gradient(circle at 30% 30%,#33402b,#121510);text-align:center}.cd-fake small{font-weight:400;color:#8f9a86}</style>
</head>
<body class="th-white">
<div class="rc" id="rc">
  <div class="rc-left">
    <a class="cd-home" href="../index.html">← Library</a>
    <div class="rc-sep"></div>
    <span class="rc-lbl">Size</span>
    <div class="rc-grp"><button class="rc-btn" id="sz-down">A−</button><button class="rc-btn on" id="sz-lbl">M</button><button class="rc-btn" id="sz-up">A+</button></div>
    <div class="rc-sep"></div>
    <span class="rc-lbl">Width</span>
    <input type="range" class="width-slider" id="width" min="40" max="100" step="10" value="60">
    <div class="rc-sep"></div>
    <span class="rc-lbl">Theme</span>
    <div class="rc-grp theme-fan" id="themes">
      <button class="rc-btn" data-th="white">White</button><button class="rc-btn" data-th="paper">Paper</button><button class="rc-btn" data-th="sepia">Sepia</button><button class="rc-btn" data-th="slate">Slate</button><button class="rc-btn" data-th="dark">Dark</button>
    </div>
    <div class="rc-sep"></div>
    <div class="mode-panel youtube" id="mode">
      <div class="mode-body">
        <button class="mode-play" id="play" title="Play / pause (Space)"></button>
        <span class="mode-time" id="time">0:00</span>
        <button class="mode-follow" id="rate" title="Speed">1×</button>
        <button class="mode-follow on" id="fo" title="Text scrolls to follow along"></button>
        <button class="mode-follow on" id="hl" title="Highlight the word being spoken"></button>
      </div>
    </div>
  </div>
  <div class="rc-right">
    <span class="cd-note" id="note"></span>
    <div class="rc-grp cd-view" id="view" hidden><button class="rc-btn" data-v="captions" title="The captions as YouTube made them">Captions</button><button class="rc-btn" data-v="cleaned" title="The text the AI cleaned up">Cleaned</button></div>
    <button class="ib-label cd-clean" id="clean" hidden title="Clean up the captions with AI: sentences, speakers, misheard words">✦ Clean up</button>
    <select class="cd-pick" id="pick" aria-label="Choose a text"><option value="demo">Demo text</option></select>
    <button class="ib-label" id="keys" title="Keyboard shortcuts and options">⌨ Keys</button>
    <button class="ib-label" id="full" title="Watch full screen with subtitles (F)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Full screen</button>
  </div>
</div>

<main class="cd-scroll" id="scroll"><article class="cd-page" id="page"></article></main>
<button class="cd-back" id="back">Follow again</button>

<script src="../icons.js"></script>
<script src="cadence-shape.js"></script>
<script src="cadence.js"></script>
<script src="cadence-theater.js"></script>
<script src="cadence-clean.js"></script>
<script src="cadence-cleanup.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ICON = {
    play: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.8v8.4L10 6z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.4" y="1.8" width="2.6" height="8.4" rx=".6" fill="currentColor"/><rect x="7" y="1.8" width="2.6" height="8.4" rx=".6" fill="currentColor"/></svg>',
    follow: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v7M3 5.5 6 8.5 9 5.5M2 11h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    hl: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10h8M3.5 7.5 8 3l1.5 1.5L5 9H3.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>'
  };
  $('fo').innerHTML = ICON.follow + ' Follow';
  $('hl').innerHTML = ICON.hl + ' Highlight';

  // ── the page, the clock, the follower, the video, the subtitles ───────
  const page = TTPage($('page'));
  let follow = null, clock = null, index = null, doc = null, yt = null, subs = null, lastRow = null;
  const translate = CadenceTranslate({ target: store('cadence-target') || 'en' });
  const panel = CadencePanel({ scroller: $('scroll'), page: $('page'), onLayout: () => follow && follow.relayout() });
  panel.show(false);

  // ── size, width, theme (as app.js: 8 sizes, width 40–100 %, five themes) ─
  const SIZES = [14, 16, 18, 20, 23, 26, 30, 36], LABELS = ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL', '4XL'];
  let size = Math.max(0, Math.min(7, +(store('cadence-size') ?? 3)));
  let width = Math.max(40, Math.min(100, +(store('cadence-width') ?? 60)));
  let theme = store('cadence-theme') || 'white';
  function applyLook() {
    document.documentElement.style.setProperty('--size', SIZES[size] + 'px');
    // width is a share of the pane, as in app.js
    document.documentElement.style.setProperty('--measure', Math.round(Math.max(420, $('scroll').clientWidth * width / 100)) + 'px');
    $('sz-lbl').textContent = LABELS[size];
    $('width').value = width;
    document.body.className = document.body.className.replace(/\bth-\w+/g, '').trim() + ' th-' + theme;
    $('themes').querySelectorAll('[data-th]').forEach(b => b.classList.toggle('on', b.dataset.th === theme));
    panel.place();
    if (follow) follow.relayout();
  }
  $('sz-down').onclick = () => { size = Math.max(0, size - 1); store('cadence-size', size); applyLook(); };
  $('sz-up').onclick = () => { size = Math.min(7, size + 1); store('cadence-size', size); applyLook(); };
  $('width').oninput = () => { width = +$('width').value; store('cadence-width', width); applyLook(); };
  $('themes').onclick = e => { const b = e.target.closest('[data-th]'); if (!b) return; theme = b.dataset.th; store('cadence-theme', theme); applyLook(); };
  addEventListener('resize', applyLook);
  applyLook();

  // ── open a document with a clock ──────────────────────────────────────
  function open(d, c, title) {
    doc = d;
    const problems = TimedText.validate(d);
    if (problems.length) console.warn('[cadence] document problems:', problems);
    page.render(d);
    index = TimedText.buildIndex(d);
    document.title = (title || 'Cadence') + ' · Cadence';
    $('note').textContent = !index.timedCount ? 'No timing: plain page' : '';
    $('scroll').scrollTop = 0;
    if (!follow) {
      follow = TTFollow({ page, index, clock: c, scroller: $('scroll'), topInset: panel.topInset,
        highlight: store('cadence-hl') !== '0', follow: store('cadence-fo') !== '0' });
      follow.on(showState);
      subs = CadenceSubs(panel.subsEl, { doc: d, follow, translate, decorate: el => decorate(el), mode: store('cadence-subs') || 'both',
        order: store('cadence-order') || 'orig', blur: store('cadence-blur') || 'none' });
    } else { follow.setIndex(index); subs.setDoc(d); }
    setClock(c);
    showState(follow.state());
    showSubMode();
  }
  function setClock(c) {
    clock = c;
    if (follow) follow.setClock(c);
    ['play', 'rate', 'time'].forEach(id => $(id).style.visibility = c ? '' : 'hidden');
    $('full').style.display = panel.el.style.display === 'none' ? 'none' : '';
  }

  // ── reader controls ───────────────────────────────────────────────────
  function showState(s) {
    $('hl').classList.toggle('on', s.highlight);
    $('fo').classList.toggle('on', s.follow && !s.paused);
    $('fo').classList.toggle('held', s.follow && s.paused);
    $('fo').title = s.follow && s.paused ? 'Follow is paused because you scrolled. Click (or G) to follow again' : s.follow ? 'Follow is on (G)' : 'Follow is off (G)';
    document.body.classList.toggle('no-hl', !s.highlight);
    const back = $('back');
    back.classList.toggle('show', s.follow && s.paused && !!(clock && index && index.timedCount) && panel.mode !== 'theater');
    back.textContent = s.where === 'above' ? 'Back to the text ↑' : s.where === 'below' ? 'Back to the text ↓' : 'Follow again';
  }
  $('hl').onclick = () => { const v = !follow.state().highlight; store('cadence-hl', v ? '1' : '0'); follow.setHighlight(v); };
  // The Follow button (and G): if follow is on but paused by a scroll, it means
  // "follow now", not "turn off". Before, the first press turned it off (9 Nov).
  $('fo').onclick = () => {
    const s = follow.state();
    if (s.follow && s.paused) { follow.resume(); return; }
    const v = !s.follow; store('cadence-fo', v ? '1' : '0'); follow.setFollow(v);
  };
  $('back').onclick = () => follow.resume();
  const toggle = () => { if (clock) { clock.toggle(); follow.kick(); } };
  $('play').onclick = toggle;
  panel.$('.cd-tplay').onclick = toggle;
  const RATES = [1, 0.75, 0.5, 1.25, 1.5];
  $('rate').onclick = () => {
    if (!clock) return;
    const r = RATES[(RATES.indexOf(clock.rate()) + 1) % RATES.length] || 1;
    clock.setRate(r); $('rate').textContent = r + '×';
  };
  const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let wasPlaying = null, wasAd = false;
  (function ui() {
    if (clock) {
      const p = clock.playing(), t = clock.time(), d = clock.duration();
      if (p !== wasPlaying) {
        wasPlaying = p;
        $('play').innerHTML = (p ? ICON.pause : ICON.play) + (p ? ' Pause' : (clock.kind === 'sim' ? ' Play' : ' Play video'));
        panel.$('.cd-tplay').innerHTML = p ? '❚❚' : '▶';
        document.body.classList.toggle('cd-paused', !p);
        if (p) autoPaused = false;
        if (p && tipPinned && panel.mode === 'theater') closeTip();
      }
      const adOn = !!(clock.adPlaying && clock.adPlaying());
      $('time').textContent = adOn ? 'Ad playing' : fmt(t) + (d ? ' / ' + fmt(d) : '');
      if (adOn !== wasAd) { wasAd = adOn; $('play').innerHTML = adOn ? ICON.pause + ' Ad' : $('play').innerHTML; if (!adOn) wasPlaying = null; }
      if (tipEl && tipAnchor && !tipAnchor.isConnected && !tipPinned) closeTip();
      if (follow && follow.state().paused) showState(follow.state());
    }
    setTimeout(ui, 150);
  })();

  // ── ?diag: what the YouTube player reports, twice a second, to copy ──
  // For when an ad still slips through: play until one comes, then Copy.
  if (params.has('diag')) {
    const box = document.createElement('div'); box.className = 'cd-diag';
    box.innerHTML = '<div><b>diag</b> <button>Copy</button> <button>Clear</button> <button title="Download this text (its captions and times) as a file">Export text</button></div><pre></pre>';
    document.body.appendChild(box);
    const pre = box.querySelector('pre'), log = [];
    const [copyB, clearB, expB] = box.querySelectorAll('button');
    // Export: the text as stored (body + caption segments) and as Cadence reads it,
    // so a chat can work on it (e.g. the cleanup bench) without the account.
    expB.onclick = () => {
      if (!doc) return;
      const data = { exported: new Date().toISOString(), row: lastRow, doc };
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
      a.download = 'cadence-' + ((lastRow && lastRow.ext_id) || doc.id || 'text') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      expB.textContent = 'Exported'; setTimeout(() => expB.textContent = 'Export text', 1500);
    };
    copyB.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(log.join('\n')); copyB.textContent = 'Copied'; setTimeout(() => copyB.textContent = 'Copy', 1200); };
    clearB.onclick = () => { log.length = 0; pre.textContent = ''; };
    setInterval(() => {
      if (!clock || !clock.probe) return;
      const r = clock.probe();
      const line = [new Date().toISOString().slice(11, 23), 'st=' + r.state, 'raw=' + r.raw, 'dur=' + r.dur, 'id=' + r.id,
        'ad?' + (clock.adPlaying() ? 'YES' : 'no'), 'idLen=' + r.idOrLength, 'frozen=' + r.frozen, 'ours=' + Math.round(clock.time()),
        'title=' + JSON.stringify((r.title || '').slice(0, 40))].join(' ');
      log.push(line); if (log.length > 2400) log.shift();
      pre.textContent = log.slice(-14).join('\n');
      if (box.parentNode !== panel.host()) panel.host().appendChild(box);
    }, 500);
  }

  // Play from a word (right-click menu, the tooltip's button, or a hotkey).
  function playFromWord(id) {
    if (!id || !clock || !index) return false;
    let info = index.wordInfo(id);
    if (info && info.start == null) info = index.words.find(w => w.order > info.order) || null;
    if (!info) return false;
    clock.seek(info.start); clock.play(); follow.resume(); follow.kick();
    return true;
  }

  // ── the two views ─────────────────────────────────────────────────────
  $('full').onclick = () => panel.setMode('theater');
  panel.onMode(m => {
    closeTip(); closeCtx();
    if (m === 'theater') { panel.wake(); follow.kick(); }
    else { follow.resume(); }              // back in the reader: at the same place
    showState(follow.state());
  });

  // subtitle mode and language
  function showSubMode() {
    panel.$('.cd-submode').querySelectorAll('[data-sub]').forEach(b => b.classList.toggle('on', b.dataset.sub === subs.mode));
    panel.$('.cd-target').value = translate.target;
    panel.$('.cd-target').style.display = subs.mode === 'both' ? '' : 'none';
    panel.$('.cd-order').querySelectorAll('[data-order]').forEach(b => b.classList.toggle('on', b.dataset.order === subs.order));
    panel.$('.cd-blur').querySelectorAll('[data-blur]').forEach(b => b.classList.toggle('on', b.dataset.blur === subs.blur));
  }
  panel.$('.cd-submode').onclick = e => { const b = e.target.closest('[data-sub]'); if (b) setSub(b.dataset.sub); };
  panel.$('.cd-target').onchange = e => { translate.setTarget(e.target.value); store('cadence-target', e.target.value); subs.refresh(); };

  // ── a word in the subtitles: the same tooltip as on the page ────────
  // Hover a word (also while playing, unless turned off in Keys): the tooltip
  // shows and goes when you move away. Click or tap a word: the video pauses and
  // the tooltip stays. Drag across words: a tooltip for the phrase.
  let pickedEl = null;
  function picked(el) { if (pickedEl) pickedEl.classList.remove('picked'); pickedEl = el; if (el) el.classList.add('picked'); }
  const bare = raw => raw.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '') || raw;
  function wordTip(el, pin) {
    openTip({ text: bare(el.textContent), wid: el.dataset.w, anchor: el, pin, pause: pin, translate: true });
    picked(el);
  }
  // Caption lines last 2–3 s, so by default hovering a subtitle word pauses the
  // video (as Language Reactor does) and moving off the subtitles plays again.
  let hoverT = 0, leaveT = 0, autoPaused = false;
  const hoverMode = () => { const m = opt('subHover'); return m === 'always' ? 'keep' : m; }; // 'always' was the first name
  const overSubs = () => !!panel.subsEl.querySelector('.cd-sub-o:hover, .cd-sub-t:hover');
  const leaveSoon = () => {
    clearTimeout(leaveT);
    leaveT = setTimeout(() => {
      if (tipPinned || (tipEl && tipEl.matches(':hover')) || overSubs()) return;
      if (tipEl) closeTip();
      if (autoPaused) { autoPaused = false; if (clock && !clock.playing()) { clock.play(); follow.kick(); } }
    }, 280);
  };
  panel.subsEl.addEventListener('pointerover', e => {
    const el = e.target.closest('.cd-sw'); if (!el || e.pointerType === 'touch' || !clock) return;
    clearTimeout(leaveT);
    if (tipPinned || e.buttons) return;                     // a clicked tooltip stays; dragging selects
    const mode = hoverMode();
    if (mode === 'paused' && clock.playing()) return;
    clearTimeout(hoverT);
    hoverT = setTimeout(() => {
      if (tipPinned || !el.isConnected || !el.matches(':hover')) return;
      if (mode === 'pause' && clock.playing()) { clock.pause(); autoPaused = true; follow.kick(); }
      wordTip(el, false);
    }, clock.playing() ? 150 : 110);
  });
  panel.subsEl.addEventListener('pointerout', () => { clearTimeout(hoverT); leaveSoon(); });
  panel.subsEl.addEventListener('click', e => {
    const el = e.target.closest('.cd-sw'); if (!el || !clock) return;
    e.stopPropagation();
    const sel = getSelection(); if (sel && !sel.isCollapsed && sel.toString().trim()) return; // a drag: mouseup handles it
    clearTimeout(hoverT); clearTimeout(leaveT);
    autoPaused = false;                                     // clicked: it stays paused
    wordTip(el, true);
  });
  panel.subsEl.addEventListener('mouseup', () => setTimeout(() => {
    const sel = getSelection();
    if (sel && !sel.isCollapsed && sel.toString().trim() && panel.subsEl.contains(sel.anchorNode)) openTipFromSelection(false);
  }, 10));
  panel.el.addEventListener('click', e => { if (panel.mode === 'theater' && !e.target.closest('.cd-sw, .cd-tt, .cd-tbar, .cd-menu')) closeTip(); });

  // ── shortcuts: editable, as app.js's Keyboard shortcuts panel ──────
  // Defaults follow app.js where the action exists there. Esc is fixed.
  const ACTIONS = [
    { id: 'play',        label: 'Play / pause',               def: ' ' },
    { id: 'prevLine',    label: 'Previous line',              def: ',' },
    { id: 'nextLine',    label: 'Next line',                  def: '.' },
    { id: 'playFromSel', label: 'Play from selection',        def: '' },
    { id: 'translate',   label: 'Translate selection',        def: 't' },
    { id: 'followToggle',label: 'Follow on / off',            def: 'g' },
    { id: 'hlToggle',    label: 'Highlight on / off',         def: 'h' },
    { id: 'fullscreen',  label: 'Full screen on / off',       def: 'f' },
    { id: 'subMode',     label: 'Subtitles: off, original, dual', def: 'c' },
    { id: 'subBlur',     label: 'Blur: next setting',         def: 'b' },
    { id: 'subOrder',    label: 'Swap subtitle order',        def: 'o' },
    { id: 'sizeUp',      label: 'Bigger text',                def: '+' },
    { id: 'sizeDown',    label: 'Smaller text',               def: '-' },
    { id: 'speed',       label: 'Next speed',                 def: 's' }
  ];
  const OPTIONS = {
    dbl:   { label: 'Double-click a word', def: 'select', choices: [['select', 'Selects it (and shows the tooltip)'], ['play', 'Plays from there']] },
    right: { label: 'Right-click a word',  def: 'menu',   choices: [['menu', 'Shows "Play from here"'], ['browser', 'The browser\'s own menu']] },
    tipWhilePlaying: { label: 'Tooltip while playing', def: 'keep', choices: [['keep', 'Video keeps playing'], ['pause', 'Pauses the video']] },
    subHover: { label: 'Hover a subtitle word', def: 'pause', choices: [['pause', 'Pauses until you move away'], ['keep', 'Shows the tooltip, video keeps playing'], ['paused', 'Only when already paused']] }
  };
  let keyPrefs = (() => { try { return JSON.parse(store('cadence-keys') || '{}') || {}; } catch (e) { return {}; } })();
  const key = id => keyPrefs[id] != null ? keyPrefs[id] : (ACTIONS.find(a => a.id === id) || {}).def || '';
  const opt = id => (keyPrefs['opt:' + id]) || OPTIONS[id].def;
  const saveKeys = () => store('cadence-keys', JSON.stringify(keyPrefs));
  const keyName = k => !k ? '—' : k === ' ' ? 'Space' : k.length === 1 ? k.toUpperCase() : k;
  function keyMap() { const m = {}; for (const a of ACTIONS) { const k = key(a.id); if (k) m[k.toLowerCase()] = a.id; } return m; }

  function selectedWordId() {
    const sel = getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0), host = $('page');
    const start = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
    const sw = start && start.closest && start.closest('.cd-sw');
    if (sw && panel.subsEl.contains(sw)) return sw.dataset.w;
    if (!host.contains(r.startContainer)) return null;
    return page.wordAt(start) || (start.querySelector && (start.querySelector('.tt-w') || {}).dataset?.w) || null;
  }
  const SUBMODES = ['off', 'original', 'both'], BLURS = ['none', 'trans', 'orig', 'both'];
  function run(id) {
    switch (id) {
      case 'play': toggle(); if (panel.mode === 'theater') panel.wake(); return true;
      case 'prevLine': case 'nextLine': {
        if (!clock || !index) return false;
        const t = index.lineStartNear(clock.time(), id === 'prevLine' ? -1 : 1);
        if (t == null) return false;
        clock.seek(t); if (panel.mode !== 'theater') follow.resume(); follow.kick(); return true;
      }
      case 'playFromSel': { const w = selectedWordId(); if (!w) return false; closeTip(); return playFromWord(w); }
      case 'translate': return openTipFromSelection(true);
      case 'followToggle': $('fo').click(); return true;
      case 'hlToggle': $('hl').click(); return true;
      case 'fullscreen': if (panel.el.style.display === 'none') return false; panel.setMode(panel.mode === 'theater' ? 'docked' : 'theater'); return true;
      case 'subMode': setSub(SUBMODES[(SUBMODES.indexOf(subs.mode) + 1) % 3]); if (panel.mode === 'theater') panel.wake(); return true;
      case 'subBlur': setLook({ blur: BLURS[(BLURS.indexOf(subs.blur) + 1) % 4] }); if (panel.mode === 'theater') panel.wake(); return true;
      case 'subOrder': setLook({ order: subs.order === 'orig' ? 'trans' : 'orig' }); if (panel.mode === 'theater') panel.wake(); return true;
      case 'sizeUp': $('sz-up').click(); return true;
      case 'sizeDown': $('sz-down').click(); return true;
      case 'speed': $('rate').click(); return true;
    }
    return false;
  }
  document.addEventListener('keydown', e => {
    if (e.target && (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable)) return;
    if (document.querySelector('.cd-modal-bg')) return; // the shortcuts panel is listening
    if (e.key === 'Escape') {
      if (tipEl || ctxEl) { closeTip(); closeCtx(); return; }
      if (panel.mode === 'theater') { panel.setMode('docked'); return; }
      return;

      <input id="cl-spk" class="cd-cl-in" type="text" value="${esc(speakers)}" placeholder="S1 = the host, asks the questions; S2 = the guest">
      <div class="cd-modal-sub">Start</div>
      <div class="cd-cl-radio"><label><input type="radio" name="cl-from" value="start" checked> From the beginning</label>
        <label><input type="radio" name="cl-from" value="here"${clock && clock.time() > 5000 ? '' : ' disabled'}> From where the video is now</label></div>
      <div class="cd-modal-sub">Gemini key</div>
      ${k ? `<div class="cd-cl-p">Uses the key saved in the Reader Lab (…${esc(k.slice(-4))}). <button class="cd-cl-link" id="cl-chg">Use another</button></div>` : ''}
      <input id="cl-key" class="cd-cl-in" type="password" placeholder="Paste a Gemini API key (starts with AIza)" ${k ? 'hidden' : ''}>
      <div class="cd-modal-note">The calls go from this browser straight to Google with this key. The cleaned text is kept in this browser only, not in your library.</div>
      <div class="cd-cl-err" id="cl-err" hidden></div>
      <div class="cd-modal-acts">${rec ? '<button id="cl-forget">Forget this cleanup</button>' : ''}<button id="cl-cancel">Cancel</button><button class="go" id="cl-go">${rec && done ? (done < total ? 'Clean up the rest' : 'Done') : 'Clean up'}</button></div>
    </div>`;
    document.body.appendChild(bg);
    const q = s => bg.querySelector(s);
    const showEst = () => { const e = CU.estimate(capDoc, q('#cl-model').value); q('#cl-est').textContent = `About ${Math.round(e.minutes)} min of video, ${e.words.toLocaleString()} words. On Google's free tier it costs nothing; paid, about ${e.cents < 1 ? 'under 1' : Math.round(e.cents)}¢.`; };
    showEst(); q('#cl-model').onchange = showEst;
    const close = () => bg.remove();
    q('#cl-cancel').onclick = close;
    bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
    if (q('#cl-chg')) q('#cl-chg').onclick = () => { q('#cl-key').hidden = false; q('#cl-key').focus(); };
    if (q('#cl-forget')) {
      let sure = false;
      q('#cl-forget').onclick = () => {
        if (!sure) { sure = true; q('#cl-forget').textContent = 'Forget it? Press again'; return; }
        CU.forget(capDoc.id); cleanRec = null; cleanBuilt = null; close();
        if (showingCleaned()) swapDoc(capDoc); else cleanUi();
      };
    }
    q('#cl-go').onclick = () => {
      if (rec && done >= total) { close(); return; }
      const nk = q('#cl-key').hidden ? '' : q('#cl-key').value.trim();
      if (!k && !nk) { q('#cl-err').hidden = false; q('#cl-err').textContent = 'Paste a Gemini key first. You can make one in Google AI Studio.'; return; }
      if (nk) CU.setKey(nk);
      const m = q('#cl-model').value, sp = q('#cl-spk').value.trim();
      store('cadence-clean-model', m); store('cadence-speakers:' + capDoc.id, sp);
      if (!cleanRec) cleanRec = CU.newRecord(capDoc, { model: m, speakers: sp, title: capTitle });
      else cleanRec.speakers = sp;
      let startPart = 0;
      if (q('input[name="cl-from"]:checked').value === 'here' && clock) {
        const t = clock.time(), L = CU.lineList(capDoc);
        const i = cleanRec.parts.findIndex(p => { const l = L[p.to - 1].line; return typeof l.end === 'number' && l.end >= t; });
        startPart = Math.max(0, i);
      }
      close();
      startCleanup(startPart);
    };
  }
  $('clean').onclick = openCleanup;

  async function startCleanup(startPart) {
    const id = capDoc.id, rec = cleanRec, ctl = new AbortController();
    cleanJob = ctl;
    const rebuild = () => {
      if (!capDoc || capDoc.id !== id) return;               // another text was opened meanwhile
      cleanBuilt = CU.build(capDoc, rec);
      if (cleanBuilt.done && (showingCleaned() || viewPref(id) === 'cleaned')) swapDoc(cleanBuilt.doc); else cleanUi();
    };
    CU.save(id, rec); rebuild();
    $('note').textContent = '';
    await CU.run(capDoc, rec, { key: CU.key(), signal: ctl.signal, startPart,
      onPart: () => { if (!CU.save(id, rec)) $('note').textContent = 'This browser is full: the cleaned text won’t all be kept'; rebuild(); },
      onError: (i, e) => { CU.save(id, rec); $('note').textContent = 'Clean up stopped at part ' + (i + 1) + ': ' + e.message; }
    });
    if (cleanJob === ctl) cleanJob = null;
    rebuild();
  }

  // ── the demo: timed by hand-written pace, with an overlap and an untimed addition
  function demoDoc() {
    const L = [
      ['heading', null, 'Ein ganz normaler Morgen', 'A perfectly normal morning'],
      ['paragraph', null, 'Ich stehe jeden Tag um sechs Uhr auf.', 'I get up at six every day.'],
      ['paragraph', null, 'Zuerst mache ich das Fenster auf und atme die kalte Luft ein.', 'First I open the window and breathe in the cold air.'],
      ['paragraph', null, 'Dann gehe ich in die Küche, koche Wasser und mache mir einen starken Kaffee.', 'Then I go to the kitchen, boil water and make myself a strong coffee.'],
      ['paragraph', null, 'Meine Mitbewohnerin schläft meistens noch, also bin ich ganz leise.', 'My flatmate is usually still asleep, so I am very quiet.'],
      ['dialogue', 'Anna', 'Guten Morgen! Ist noch Kaffee da?', 'Good morning! Is there any coffee left?'],
      ['dialogue', 'Ben', 'Nein, tut mir leid, ich habe alles getrunken.', 'No, sorry, I drank all of it.'],
      ['dialogue', 'Anna', 'Was? Schon wieder!', 'What? Again!'],
      ['paragraph', null, 'Danach lese ich zehn Minuten die Nachrichten auf meinem Handy.', 'Afterwards I read the news on my phone for ten minutes.'],
      ['paragraph', null, 'Um sieben Uhr ziehe ich mich an und gehe zur Arbeit. Der Bus kommt immer pünktlich, aber er ist immer voll.', 'At seven I get dressed and go to work. The bus always comes on time, but it is always full.'],
      ['paragraph', null, 'Im Bus höre ich Musik oder ich schaue einfach aus dem Fenster und denke an nichts.', 'On the bus I listen to music, or I just look out of the window and think about nothing.'],
      ['paragraph', null, 'Wenn ich ankomme, ist es meistens schon hell, und der Tag kann beginnen.', 'When I arrive it is usually light already, and the day can begin.'],
      ['paragraph', null, 'Später am Abend erzähle ich Anna, dass ich morgen früher aufstehe, damit ich neuen Kaffee kaufen kann.', 'Later in the evening I tell Anna that I will get up earlier tomorrow so I can buy new coffee.'],
      ['paragraph', null, 'Sie lacht und sagt, dass sie das nicht glaubt.', 'She laughs and says she does not believe it.'],
      ['untimed', null, '(Dieser Absatz wurde später hinzugefügt und hat keine Zeit. Er wird gelesen, aber nicht verfolgt.)', '(This paragraph was added later and has no time. It is read, but not followed.)']
    ];
    const d = { id: 'doc_demo', language: 'de', media: null,
      origin: { route: 'own_transcript', by: 'creator', created_at: '2026-11-08T00:00:00Z' },
      blocks: [], lines: {}, notes: [] };
    let t = 800, wn = 0, ln = 0, lastDlg = null;
    for (const [type, speaker, text, en] of L) {
      const lid = 'l' + (++ln);
      const words = TimedText.tokenize(text).map(x => ({ id: 'w' + (++wn), text: x.text }));
      const line = { words, translation: { en } };
      if (speaker) line.speaker = speaker;
      if (type !== 'untimed') {
        // a natural-ish pace: ~3 words a second, longer words take longer, pauses at punctuation
        let s = (type === 'dialogue' && speaker === 'Ben') ? t - 1900 : t; // Ben cuts in over Anna's last words
        line.start = s;
        for (const w of words) {
          const letters = w.text.replace(/[^\p{L}]/gu, '').length;
          const dur = 150 + letters * 42;
          w.start = Math.round(s); w.end = Math.round(s + dur); w.by = 'hand';
          s += dur + (/[.!?]$/.test(w.text) ? 380 : /[,;:]$/.test(w.text) ? 200 : 40);
        }
        line.end = words[words.length - 1].end;
        t = s + (type === 'heading' ? 900 : 500);
      }
      d.lines[lid] = line;
      if (type === 'dialogue') {
        if (!lastDlg) { lastDlg = { type: 'dialogue', lines: [] }; d.blocks.push(lastDlg); }
        lastDlg.lines.push(lid);
      } else {
        lastDlg = null;
        d.blocks.push({ type: type === 'untimed' ? 'paragraph' : type, lines: [lid] });
      }
    }
    // one note, to prove notes ride along without touching timing (not drawn yet)
    const ben = Object.values(d.lines).find(l => l.speaker === 'Ben');
    d.notes.push({ id: 'n1', words: [ben.words[0].id], kind: 'meant', text: 'Nein, leider nicht.', status: 'open',
                   history: [{ at: '2026-11-08T00:00:00Z', by: 'creator', did: 'raised' }] });
    return d;
  }
  function openDemo() {
    if (cleanJob) cleanJob.abort();
    capDoc = null; cleanRec = null; cleanBuilt = null; cleanUi();
    const d = demoDoc();
    stopYt();
    open(d, TTClock.sim(TimedText.buildIndex(d).duration + 1500), 'Demo · Ein ganz normaler Morgen');
    // no video for the demo: a stand-in screen, so both views can be tried
    panel.screen.querySelector('#cd-yt').innerHTML = '<div class="cd-fake">Demo · no video<br><small>the clock runs on its own</small></div>';
    panel.show(true);
    $('full').style.display = '';
  }

  // ── YouTube: one player, created once per video, never moved ──────────
  function loadYtApi(cb) {
    if (window.YT && window.YT.Player) return cb();
    (window._ytCbs = window._ytCbs || []).push(cb);
    if (window._ytLoading) return; window._ytLoading = true;
    window.onYouTubeIframeAPIReady = () => { (window._ytCbs || []).forEach(f => f()); window._ytCbs = []; };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
  function stopYt() {
    if (yt) { try { yt.destroy(); } catch (e) {} yt = null; }
    panel.screen.innerHTML = '<div id="cd-yt"></div>';
  }
  function openVideo(d, videoId, title) {
    stopYt();
    panel.show(true);
    open(d, null, title); // the text first; the clock arrives when the player is ready
    loadYtApi(() => {
      yt = new YT.Player('cd-yt', {
        videoId, host: 'https://www.youtube-nocookie.com',
        playerVars: { rel: 0, modestbranding: 1, playsinline: 1, fs: 0, origin: location.origin },
        events: { onReady: e => { setClock(TTClock.youtube(e.target, { videoId, textEnd: index ? index.duration : 0 })); $('rate').textContent = '1×'; }, onStateChange: () => follow && follow.kick() }
      });
    });
  }

  // ── the account (read only) ───────────────────────────────────────────
  // Same database and sign-in as the app: sign in there, then come back here.
  let sb = null;
  async function connect() {
    if (params.has('demo')) return null;
    await new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
    }).catch(() => null);
    await new Promise(res => { const s = document.createElement('script'); s.src = '../config.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); });
    if (!window.supabase || typeof VOCAB_ENVS === 'undefined') return null;
    let env = store('vocabEnv'); if (!VOCAB_ENVS[env]) env = VOCAB_DEFAULT_ENV;
    if (env === 'dev') { const b = document.createElement('span'); b.className = 'cd-env'; b.textContent = 'DEV'; $('pick').before(b); }
    sb = supabase.createClient(VOCAB_ENVS[env].url, VOCAB_ENVS[env].anon, { auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true } });
    const { data } = await sb.auth.getSession();
    return data && data.session ? sb : null;
  }
  async function listTexts() {
    const { data, error } = await sb.from('sources').select('ext_id,title,video_id,last_active_at')
      .is('deleted_at', null).order('last_active_at', { ascending: false, nullsFirst: false }).limit(300);
    if (error) { console.warn('[cadence] list failed', error.message); return; }
    const pick = $('pick');
    for (const r of data || []) {
      if (!r.ext_id) continue;
      const o = document.createElement('option');
      o.value = r.ext_id; o.textContent = (r.video_id ? '▶ ' : '') + (r.title || 'Untitled');
      pick.appendChild(o);
    }
  }
  async function openText(extId) {
    const { data, error } = await sb.from('sources').select('ext_id,title,body,segments,video_id').eq('ext_id', extId).limit(1);
    const r = data && data[0];
    if (error || !r) { $('page').innerHTML = '<div class="cd-empty">Could not open this text.</div>'; return; }
    lastRow = r;
    if (cleanJob) cleanJob.abort();
    const d0 = TimedText.fromCaptions({ id: r.ext_id, body: r.body, segments: r.segments, videoId: r.video_id });
    const d = docFor(d0, r.title);
    if (r.video_id) openVideo(d, r.video_id, r.title);
    else { stopYt(); panel.show(false); open(d, null, r.title); }
    markAi(); cleanUi();
  }

  $('pick').onchange = () => {
    const v = $('pick').value;
    const u = new URL(location.href);
    if (v === 'demo') { u.searchParams.delete('text'); openDemo(); }
    else { u.searchParams.set('text', v); openText(v); }
    u.searchParams.delete('demo');
    history.replaceState(null, '', u);
  };

  // ── start ─────────────────────────────────────────────────────────────
  (async function start() {
    const want = params.get('text');
    if (!want) openDemo();
    else $('page').innerHTML = '<div class="cd-empty">Opening…</div>';
    const client = await connect().catch(() => null);
    if (!client) {
      if (want) { $('page').innerHTML = '<div class="cd-empty">Sign in on the Library page first, then come back.</div>'; }
      const o = document.createElement('option'); o.disabled = true; o.textContent = 'Sign in on the Library page to see your texts';
      $('pick').appendChild(o);
      return;
    }
    await listTexts();
    if (want) { $('pick').value = want; await openText(want); }
  })();

  window.__cadence = { openRow(r) { lastRow = r; const d = docFor(TimedText.fromCaptions({ id: r.ext_id, body: r.body, segments: r.segments, videoId: r.video_id }), r.title); stopYt(); panel.show(false); open(d, null, r.title); markAi(); cleanUi(); },
    get follow() { return follow; }, get clock() { return clock; }, get index() { return index; }, get doc() { return doc; }, get subs() { return subs; }, page, panel, translate };
})();
</script>
