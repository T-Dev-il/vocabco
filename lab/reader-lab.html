  A COPY OF THE WEBSITE, NOT A NEW ONE. index.html, app.js and app.css as they
  stood on 2026-09-14. Four changes and no more:

    1. app.css  -> app-lab.css   (a copy, so experiments cannot reach the site)
    2. app.js   -> app-lab.js    (same)
    3. config.js, store-supabase.js and icons.js load from the folder above,
       NOT copied. START-HERE.md §5: the Supabase details are hard-coded in six
       places already, and a copy here would make it seven.
    4. Pinned to dev, under its own localStorage key, so switching the lab can
       never move the live site's choice.
    5. The lab layer at the foot of this file: the reader's tooltip rebuilt
       from slots, plus a composer. The default arrangement is the reader's
       own three, calling the reader's own functions.
    6. All items and Activity are hidden. Library stays, because it is the door
       into a text. Done here in CSS rather than in app-lab.js, so the copy of
       the app stays byte-identical to the site's and can be re-copied from it
       without losing this.

  Everything else is the site. Contractor 11, 2026-09-14.
-->

<script>
// ── which database ──────────────────────────────────────────────────────
// Remembered per browser. Live unless deliberately changed: sign out, then
// click the "Vocab Collector" heading five times. Or put #env in the address
// bar. See schema-log.md.
let ENV_NAME = null;
// The lab is dev. Its own key, so switching here never moves the live site's
// choice, and a fallback to dev rather than to VOCAB_DEFAULT_ENV, which is live.
try { ENV_NAME = localStorage.getItem('vocabEnvLab'); } catch (e) {}
if (!VOCAB_ENVS[ENV_NAME]) ENV_NAME = 'dev';
const SUPABASE_URL  = VOCAB_ENVS[ENV_NAME].url;
const SUPABASE_ANON = VOCAB_ENVS[ENV_NAME].anon;
function switchEnv(name) {
  try { localStorage.setItem('vocabEnvLab', name); } catch (e) {}
  location.hash = '';          // or the picker reopens on the way back in
  location.reload();
}
const DEEP_HASH = location.hash;  // stash before Supabase can strip it
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true } });
const $ = id => document.getElementById(id);
// exposed for the app's header menu (hamburger, top-left)
window.appSignOut = async ()=>{ await sb.auth.signOut(); location.reload(); };
let signup = false, started = false;

// The badge shows on dev and never on live. The gesture sits on the sign-in
// heading, so switching is reachable only while signed out — which is right,
// since the two databases have separate accounts anyway.
vocabEnvBanner(ENV_NAME, switchEnv);
vocabEnvGesture(document.querySelector('#auth h1'), ENV_NAME, switchEnv);
if (/^#env\b/.test(DEEP_HASH || '')) vocabEnvPicker(ENV_NAME, switchEnv);

$('toggle').onclick = () => {
  signup = !signup;
  $('go').textContent = signup ? 'Create account' : 'Sign in';
  $('toggle').textContent = signup ? 'Have an account? Sign in' : 'New here? Create an account';
};
function err(m){ const e=$('msg'); e.className='msg err'; e.textContent=m; e.style.display='block'; }
$('go').onclick = async () => {
  const email=$('email').value.trim(), password=$('pw').value;
  if(!email||!password){ err('Enter an email and password.'); return; }
  $('go').disabled=true; $('go').textContent='…';
  try{
    if(signup){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(!data.session){ err('Account created — if email confirmation is on, confirm then sign in.'); $('go').disabled=false; $('go').textContent='Create account'; return; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
  }catch(e){ err(e.message||'Sign-in failed'); $('go').disabled=false; $('go').textContent=signup?'Create account':'Sign in'; }
};
$('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') $('go').click(); });

function loadScript(src){
  return new Promise((res, rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('failed to load '+src)); document.body.appendChild(s); });
}
function flash(msg){
  const d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#23241f;color:#fff;font:13px Inter,system-ui,sans-serif;padding:10px 14px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:99999;max-width:90%;text-align:center';
  document.body.appendChild(d); setTimeout(()=>d.remove(), 9000);
}
// Open the reader for #text=<id> by driving app.js directly once its state is ready.
async function openDeepLink(){
  const m = (DEEP_HASH||'').match(/text=([^&]+)/);
  if(!m) return;
  const id = decodeURIComponent(m[1]);
  for(let i=0;i<250;i++){                       // wait until the library actually loads
    try{
      if(typeof S!=='undefined' && S && S.texts && Object.keys(S.texts).length){
        if(S.texts[id] && typeof ui!=='undefined' && typeof render==='function'){
          ui.view='reader'; ui.readerTextId=id; ui.readerEditing=false; render();
        } else {
          flash('Link points to a text not in your library ('+Object.keys(S.texts).length+' loaded).');
        }
        return;
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,200));
  }
  flash('Library didn’t finish loading in time — the load is very slow.');
}
// The open text is mirrored into the address bar by app.js (syncHistory), which also
// records a history entry per view so the Back button works. A replaceState poll here
// would wipe that state, so it's gone.
async function start(user){
  if(started) return; started = true;
  const auth = $('auth'); if(auth) auth.remove();
  const boot = document.createElement('div'); boot.id='boot'; boot.textContent='Loading your library…'; document.body.appendChild(boot);
  try{
    await VocabStore.init(sb, user.id);
    await loadScript('../icons.js').catch(()=>{});   // optional; only if your app.js uses it
    await loadScript('app-lab.js');     // boots itself, renders into #root
    if (window.labInit) window.labInit();   // the composer, once the reader exists
  }catch(e){
    boot.textContent = 'Failed to start: ' + (e.message||e);
    return;
  }
  boot.remove();
  openDeepLink();
  watchRemoteChanges(user.id);
}

// Live updates: anything saved from the extension (or another tab) lands in Supabase,
// not in this page, so nothing here would know about it. Realtime pushes those changes;
// re-focusing the tab is the fallback for when Realtime isn't available.
function watchRemoteChanges(uid){
  let timer = null, lastReload = 0;
  const bump = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      // our own save already refreshed the screen — don't re-download the library for it
      if (VocabStore.sinceLocalWrite && VocabStore.sinceLocalWrite() < 2500) return;
      if (Date.now() - lastReload < 1500) return;
      lastReload = Date.now();
      try { await VocabStore.reload(); } catch(e){ console.warn('[vocab] refresh failed', e); }
    }, 500);
  };

  try {
    const ch = sb.channel('vocab-live');
    for (const table of ['items','highlights','sources','collections','collection_items','settings']) {
      ch.on('postgres_changes', { event:'*', schema:'public', table, filter:'user_id=eq.'+uid }, bump);
    }
    ch.subscribe(s => console.log('[vocab] realtime:', s));
  } catch(e){ console.warn('[vocab] realtime unavailable', e); }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) bump(); });
  window.addEventListener('focus', bump);
}

sb.auth.onAuthStateChange((_e, session)=>{ if(session) start(session.user); });
(async()=>{ const { data:{ session } } = await sb.auth.getSession(); if(session) start(session.user); })();
</script>

<!-- ═══ THE LAB LAYER ═══════════════════════════════════════════════════
     The reader's tooltip, taken apart and put back together from parts.

     WHAT IT DOES NOT DO: change the tooltip. The default arrangement is the
     three slots app-lab.js ships with, in the same order, with the same
     classes, the same icons and the same handlers calling the same functions
     — addReaderTerm, unsaveReaderTerm, toggleReaderHighlight,
     addReaderHighlight, showInlineTranslation. Open the lab and press nothing
     in the composer and you are using the current tooltip.

     WHAT IT ADDS: the bar is now built from a list of slots rather than
     written out, so a slot can be reordered, unticked, renamed, re-iconed, or
     invented. Each kind of selection — part of a word, one word, a few words,
     a sentence, more than one, several parts — carries its own list.

     HOW IT ATTACHES: showTT, hideTT and reopenTT are function declarations in
     app-lab.js, so they are properties of window and can be replaced from
     here. S, ui and VocabStore are top-level let/const in classic scripts,
     which share one global scope across a page — so this file reads them
     directly. app-lab.js is not edited at all: it stays a byte-for-byte copy
     of the site's app.js, and can be re-copied over whenever that moves.

     Slots with no wiring behind them say so in the log rather than pretending.

     Contractor 11, 2026-09-14.
     ═══════════════════════════════════════════════════════════════════ -->

<script>
window.labInit = function(){
"use strict";
if (window.__labOn) return;
if (typeof S === "undefined"){ console.warn("[lab] app-lab.js did not load"); return; }
// The reader can finish booting before the rest of this page has parsed.
if (!document.getElementById("labbtn")){
  document.addEventListener("DOMContentLoaded", window.labInit); return;
}
window.__labOn = true;

var $ = function(id){ return document.getElementById(id); };
var K = "vc.readerlab.";
function load(k,d){ try{ var v=localStorage.getItem(K+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function saveL(k,v){ try{ localStorage.setItem(K+k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* Icons for slots the reader has none of. The three it does have use its own
   icon() so the default bar is identical to the pixel. */
var I = {
  doc:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6.5 3h7.6l5 5V20a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8.5 13h7M8.5 16.5h7" stroke-linecap="round"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  stack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3.5L20.5 8 12 12.5 3.5 8z"/><path d="M3.5 12.5L12 17l8.5-4.5"/></svg>',
  play:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M7 5v14l11-7z"/></svg>',
  edit:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20h4L18 10l-4-4L4 16zM14 6l4 4"/></svg>',
  note:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 3h14a2 2 0 0 1 2 2v9l-6 6H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 21v-5a1 1 0 0 1 1-1h5"/></svg>',
  link:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9.5 14.5l5-5"/><path d="M11 7.5l1.5-1.5a3.5 3.5 0 0 1 5 5L16 12.5"/><path d="M13 16.5L11.5 18a3.5 3.5 0 0 1-5-5L8 11.5"/></svg>',
  listPlus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6.5h10M4 12h7M4 17.5h7M16 15.5h6M19 12.5v6"/></svg>',
  dot:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="7"/></svg>'
};
function iconOf(s){
  if (s.useReaderIcon && typeof icon === "function"){ try{ return icon(s.useReaderIcon); }catch(e){} }
  return I[s.icon] || I.dot;
}

/* ── the slots ─────────────────────────────────────────────────────────
   The first three are the reader's, broken out. "wired" means the reader has
   a function behind it; the rest are shapes waiting for one. */
function defaults(){ return {
  add:       {label:"Add", useReaderIcon:"plus", showLabel:true, kind:"add", wired:true},
  translate: {label:"Translate", useReaderIcon:"translate", showLabel:false, kind:"translate", wired:true},
  highlight: {label:"Highlight", useReaderIcon:"highlight", showLabel:false, kind:"highlight", wired:true},

  sentence:  {label:"Full sentence", icon:"doc", showLabel:true, kind:"none"},
  define:    {label:"Define", icon:"doc", showLabel:false, kind:"none"},
  defineOwn: {label:"Define in English", icon:"doc", showLabel:false, kind:"none"},
  synonyms:  {label:"Synonyms", icon:"search", showLabel:false, kind:"none"},
  examples:  {label:"Used elsewhere", icon:"stack", showLabel:false, kind:"none"},
  pronounce: {label:"Say it", icon:"play", showLabel:false, kind:"none"},
  grammar:   {label:"Why this form", icon:"edit", showLabel:false, kind:"none"},
  register:  {label:"How formal", icon:"edit", showLabel:false, kind:"none"},
  relatives: {label:"Relatives here", icon:"link", showLabel:false, kind:"none"},
  note:      {label:"Note", icon:"note", showLabel:false, kind:"none"},
  collect:   {label:"Collect", icon:"listPlus", showLabel:false, kind:"none"}
};}

/* The reader ships one bar for every selection. Splitting it by extent is the
   first thing there is to try, so each starts as a copy of what exists. */
function defaultComp(){ return {
  subword:["add","translate","highlight"], word:["add","translate","highlight"],
  phrase:["add","translate","highlight"], sentence:["add","translate","highlight"],
  beyond:["add","translate","highlight"], multi:["add","translate","highlight"]
};}

var EXTENTS = [
  {id:"subword", name:"Part of a word"}, {id:"word", name:"One word"},
  {id:"phrase", name:"A few words"}, {id:"sentence", name:"A sentence"},
  {id:"beyond", name:"More than one"}, {id:"multi", name:"Several parts"}
];

var SLOTS = load("slots", null) || defaults();
var COMP  = load("comp", null) || defaultComp();
var extent = "word", picked = null, LOG = [], LAST = null, ttEl = null;

/* ── which kind of selection this is ──────────────────────────────────── */
function classify(raw, before, after){
  var t = String(raw||"").trim(); if (!t) return null;
  var L = /[A-Za-z0-9\u00C0-\u024F]/;
  if (!/\s/.test(t)){
    if ((L.test(t.charAt(0)) && L.test(before||"")) ||
        (L.test(t.charAt(t.length-1)) && L.test(after||""))) return "subword";
  }
  var words = t.match(/[A-Za-z0-9\u00C0-\u024F'\u2019-]+/g) || [];
  if ((t.match(/[.!?]\s+[A-Z\u00C0-\u00DE]/g) || []).length >= 1) return "beyond";
  if (/[.!?]["'\u201D]?$/.test(t) || words.length > 8) return "sentence";
  if (words.length > 1) return "phrase";
  return "word";
}
/* The reader owns its text, so the characters either side of the selection are
   there to be read rather than guessed at. */
function neighbours(){
  try{
    var r = ui.lastSelRange; if (!r || typeof r.start !== "number") return ["",""];
    var body = (S.texts[ui.readerTextId] || {}).body || "";
    return [body.charAt(r.start-1) || "", body.charAt(r.end) || ""];
  }catch(e){ return ["",""]; }
}

/* ── the bar ──────────────────────────────────────────────────────────── */
function say(m){ LOG.unshift(m); if (LOG.length>40) LOG.pop();
  $("loglist").innerHTML = LOG.map(function(l){ return "<li>"+esc(l)+"</li>"; }).join(""); }

function slotNode(id){
  var s = SLOTS[id]; if (!s) return null;

  if (s.kind === "highlight"){
    var cur = (S.settings.reader && S.settings.reader.lastColor) || "yellow";
    var wrap = document.createElement("div");
    wrap.className = "tt-hl-wrap";
    wrap.title = "Highlight \u2014 scroll to change color";
    wrap.innerHTML =
        '<button class="tt-hl ' + (LAST.hlId ? "on" : "") + '" id="tt-hl">'
      + '<span class="hl-pen">' + iconOf(s) + "</span>"
      + (s.showLabel ? " " + esc(s.label) : "") + "</button>"
      + '<div class="tt-colors" id="tt-colors">'
      + ["yellow","pink","blue"].map(function(c){
          return '<button class="hl-line hl-ln-' + c + (c===cur?" on":"") + '" data-color="' + c + '"></button>';
        }).join("") + "</div>";
    wrap.querySelector(".tt-hl").onclick = async function(){
      this.disabled = true;
      var hid = await toggleReaderHighlight(LAST.term, (S.settings.reader && S.settings.reader.lastColor) || "yellow");
      say(s.label); labReopen(LAST.savedId, hid);
    };
    wrap.querySelectorAll("[data-color]").forEach(function(b){
      b.onclick = async function(e){
        e.stopPropagation();
        S.settings.reader.lastColor = b.dataset.color;
        VocabStore.set({settings:S.settings});
        var hid = await addReaderHighlight(LAST.term, b.dataset.color);
        say(s.label + " \u2014 " + b.dataset.color); labReopen(LAST.savedId, hid);
      };
    });
    wrap.addEventListener("wheel", function(e){
      e.preventDefault();
      var o = ["yellow","pink","blue"];
      var i = (o.indexOf((S.settings.reader && S.settings.reader.lastColor) || "yellow")
               + (e.deltaY>0?1:-1) + 3) % 3;
      S.settings.reader.lastColor = o[i]; VocabStore.set({settings:S.settings});
      wrap.querySelectorAll("[data-color]").forEach(function(b){
        b.classList.toggle("on", b.dataset.color === o[i]); });
    }, {passive:false});
    return wrap;
  }

  var b = document.createElement("button");
  if (s.kind === "add"){
    b.className = "tt-add " + (LAST.savedId ? "on" : "");
    b.title = LAST.savedId ? "Saved \u2014 click to undo" : "Save this item";
    b.innerHTML = iconOf(s) + (s.showLabel ? " " + esc(s.label) : "");
    b.onclick = async function(){
      b.disabled = true;
      if (LAST.savedId){ await unsaveReaderTerm(LAST.savedId); say("Unsaved"); labReopen(null, LAST.hlId); }
      else { var tid = await addReaderTerm(LAST.term, "saved"); say("Add"); labReopen(tid, LAST.hlId); }
    };
    return b;
  }
  if (s.kind === "translate"){
    b.className = "tt-tr"; b.title = "Translate";
    b.innerHTML = iconOf(s) + (s.showLabel ? " " + esc(s.label) : "");
    b.onclick = function(){
      showInlineTranslation(LAST.term, ttEl.getBoundingClientRect());
      say("Translate"); labHide();
    };
    return b;
  }
  b.className = "tt-x"; b.title = s.label;
  b.innerHTML = iconOf(s) + (s.showLabel ? " " + esc(s.label) : "");
  b.onclick = function(e){
    e.stopPropagation();
    say(s.label + " \u2014 nothing behind it yet");
  };
  return b;
}

function labShow(rect, term, savedId, hlId){
  labHide();
  if (savedId === undefined) savedId = savedTermIdForRange(ui.lastSelRange);
  if (hlId === undefined)   hlId   = highlightIdForRange(ui.lastSelRange);
  LAST = {rect:rect, term:term, savedId:savedId||null, hlId:hlId||null};

  var nb = neighbours();
  var kind = classify(term, nb[0], nb[1]);
  if (kind){ extent = kind; paintExtents(); paintSlots(); }

  ttEl = document.createElement("div");
  ttEl.className = "sel-tt";
  (COMP[extent] || []).forEach(function(id){
    var n = slotNode(id); if (n) ttEl.appendChild(n);
  });
  if (!ttEl.childNodes.length){
    var e = document.createElement("span");
    e.style.cssText = "padding:6px 10px;font-size:11px;color:#9b9e96";
    e.textContent = "no slots for this";
    ttEl.appendChild(e);
  }
  ttEl.style.left = Math.max(8, Math.min(rect.left, window.innerWidth-220)) + "px";
  ttEl.style.top  = Math.max(8, rect.top - 46) + "px";
  ttEl.addEventListener("mousedown", function(e){ e.stopPropagation(); });
  document.body.appendChild(ttEl);
}
function labHide(){ if (ttEl){ ttEl.remove(); ttEl = null; } }

/* The tooltip stays open after an action so the same selection can be worked
   on — the reader's behaviour, kept. app-lab.js's own reopenTT cannot do it
   any more: it reads _ttTerm, which only its own showTT sets, and that no
   longer runs. This reads ours instead. */
function labReopen(termId, hlId){
  var el = termId ? document.querySelector('[data-rterm="' + termId + '"]') : null;
  var r = el ? el.getBoundingClientRect() : (LAST && LAST.rect);
  var term = LAST && LAST.term;
  if (!r || !term){ labHide(); return; }
  labShow(r, term, termId || null, hlId === undefined ? undefined : (hlId || null));
}

window.showTT   = labShow;
window.hideTT   = labHide;
window.reopenTT = labReopen;
document.addEventListener("mousedown", function(e){
  if (!ttEl) return;
  if (ttEl.contains(e.target)) return;
  if ($("labdr").contains(e.target) || e.target.id === "labbtn") return;
  labHide();
});

/* ── the composer ─────────────────────────────────────────────────────── */
function keep(){ saveL("slots", SLOTS); saveL("comp", COMP); }

function paintExtents(){
  $("extbar").innerHTML = EXTENTS.map(function(x){
    return '<button class="lb sm extb' + (x.id===extent?" on":"") + '" data-x="'+x.id+'">'
         + esc(x.name) + "</button>"; }).join("");
}
function paintSlots(){
  var list = COMP[extent] || [];
  var ids = Object.keys(SLOTS).sort(function(a,b){
    var ia=list.indexOf(a), ib=list.indexOf(b);
    if (ia>=0 && ib>=0) return ia-ib;
    if (ia>=0) return -1; if (ib>=0) return 1; return 0; });
  $("slotlist").innerHTML = ids.map(function(id){
    var s = SLOTS[id], inC = list.indexOf(id) >= 0;
    return '<div class="slotrow'+(inC?" in":"")+(picked===id?" picked":"")+'" data-id="'+id+'">'
      + '<input type="checkbox"'+(inC?" checked":"")+">"
      + '<span class="nm">'+esc(s.label)+"</span>"
      + '<span class="tag'+(s.wired?" wired":"")+'">'+(s.wired?"wired":"shape only")+"</span></div>";
  }).join("");
}
function paintEditor(){
  var box = $("sloteditor");
  if (!picked || !SLOTS[picked]){ box.innerHTML = "<p>Pick a slot above.</p>"; return; }
  var s = SLOTS[picked];
  var iconOpts = Object.keys(I).map(function(k){
    return '<option value="'+k+'"'+(k===s.icon?" selected":"")+">"+k+"</option>"; }).join("");
  box.innerHTML =
      '<div class="r"><label class="inl">Label</label>'
    + '<input type="text" id="eLabel" value="'+esc(s.label)+'" style="flex:1"></div>'
    + '<div class="r"><label class="inl">Icon</label>'
    + (s.useReaderIcon ? '<span style="font-size:11.5px;color:#6B7178">the reader\u2019s own \u2014 '
        + esc(s.useReaderIcon) + "</span>" : '<select id="eIcon">'+iconOpts+"</select>")
    + '<label style="font-size:11.5px"><input type="checkbox" id="eShow"'+(s.showLabel?" checked":"")+"> show label</label></div>"
    + '<p style="margin-top:9px">'+(s.wired
        ? "This one does what it says \u2014 it calls the reader\u2019s own function."
        : "Nothing behind this yet. Pressing it writes a line in the log.")+"</p>"
    + (s.wired ? "" : '<div class="r"><button class="lb sm warn" id="eDel">Delete this slot</button></div>');
}
function paintPresets(){
  var ps = load("presets", []) || [];
  $("plist").innerHTML = ps.length ? ps.map(function(p,i){
    return '<div class="r" style="justify-content:space-between"><span>'+esc(p.name)+"</span><span>"
      + '<button class="lb sm" data-use="'+i+'">Use</button> '
      + '<button class="lb sm warn" data-del="'+i+'">\u00d7</button></span></div>'; }).join("")
    : '<p style="margin:0">None yet. An arrangement is every slot and every kind of selection at once, so two can be compared rather than described.</p>';
}
function paintAll(){ paintExtents(); paintSlots(); paintEditor(); paintPresets(); }

$("labbtn").onclick = function(){ $("labdr").classList.add("on"); paintAll(); };
$("labclose").onclick = function(){ $("labdr").classList.remove("on"); };
$("extbar").onclick = function(e){
  var b = e.target.closest("[data-x]"); if (!b) return;
  extent = b.dataset.x; picked = null; paintAll();
};
$("slotlist").onclick = function(e){
  var row = e.target.closest(".slotrow"); if (!row) return;
  var id = row.dataset.id, list = COMP[extent] = (COMP[extent]||[]).slice();
  if (e.target.tagName === "INPUT"){
    var i = list.indexOf(id);
    if (i>=0) list.splice(i,1); else list.push(id);
  }
  picked = id; keep(); paintAll();
};
function move(d){
  if (!picked) return;
  var list = COMP[extent]||[], i = list.indexOf(picked), j = i+d;
  if (i<0 || j<0 || j>=list.length) return;
  list.splice(j,0,list.splice(i,1)[0]); keep(); paintAll();
}
$("moveL").onclick = function(){ move(-1); };
$("moveR").onclick = function(){ move(1); };
$("addslot").onclick = function(){
  var n = $("newslot").value.trim(); if (!n){ $("newslot").focus(); return; }
  var id = n.toLowerCase().replace(/[^a-z0-9]+/g,"") || ("slot"+Object.keys(SLOTS).length);
  while (SLOTS[id]) id += "2";
  SLOTS[id] = {label:n, icon:"dot", showLabel:false, kind:"none"};
  (COMP[extent] = COMP[extent]||[]).push(id);
  picked = id; $("newslot").value = ""; keep(); paintAll();
};
$("sloteditor").addEventListener("input", function(e){
  var s = SLOTS[picked]; if (!s) return;
  if (e.target.id === "eLabel"){ s.label = e.target.value; keep(); paintSlots(); }
});
$("sloteditor").addEventListener("change", function(e){
  var s = SLOTS[picked]; if (!s) return;
  if (e.target.id === "eIcon") s.icon = e.target.value;
  if (e.target.id === "eShow") s.showLabel = e.target.checked;
  keep(); paintAll();
});
$("sloteditor").addEventListener("click", function(e){
  if (e.target.id !== "eDel") return;
  delete SLOTS[picked];
  Object.keys(COMP).forEach(function(k){
    COMP[k] = COMP[k].filter(function(x){ return x !== picked; }); });
  picked = null; keep(); paintAll();
});
$("psave").onclick = function(){
  var n = $("pname").value.trim(); if (!n){ $("pname").focus(); return; }
  var ps = load("presets", []) || [];
  ps.push({name:n, slots:JSON.parse(JSON.stringify(SLOTS)), comp:JSON.parse(JSON.stringify(COMP))});
  saveL("presets", ps); $("pname").value=""; paintPresets();
};
$("plist").onclick = function(e){
  var ps = load("presets", []) || [];
  var u = e.target.getAttribute && e.target.getAttribute("data-use");
  var d = e.target.getAttribute && e.target.getAttribute("data-del");
  if (u){ var p = ps[+u]; if (p){ SLOTS = p.slots; COMP = p.comp; picked = null; keep(); paintAll(); } return; }
  if (d){ ps.splice(+d,1); saveL("presets", ps); paintPresets(); }
};
$("reset").onclick = function(){
  SLOTS = defaults(); COMP = defaultComp(); picked = null; keep(); paintAll();
};

paintAll();
say("Composer ready \u2014 the bar you see is the reader\u2019s own, built from parts");
};
</script>
