<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Card Machine 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
/* Lab chrome around a reading stage; one flat card floats on it. Card Machine 8 · Contractor 17 (RL) · 2026-10-12 · from Card Machine 7 */
:root{--chrome:#F3F4F1;--ink:#1B1D1A;--ink2:#5F635C;--ink3:#979A92;--hair:rgba(27,29,26,.12);--chip:#fff;
  --serif:'Source Serif 4',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif;
  --garamond:'Cormorant Garamond',Georgia,serif;--hand:'Architects Daughter','Comic Sans MS',cursive;
  --ease:cubic-bezier(.2,.75,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chrome:#222320;--ink:#ECEDE8;--ink2:#B4B7AF;--ink3:#81847C;--hair:rgba(255,255,255,.14);--chip:#2E2F2B;color-scheme:dark}}
:root[data-theme="dark"]{--chrome:#222320;--ink:#ECEDE8;--ink2:#B4B7AF;--ink3:#81847C;--hair:rgba(255,255,255,.14);--chip:#2E2F2B;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--chrome);color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #5B8DEF;outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;border-bottom:.5px solid var(--hair)}
.top h1{font:600 13px var(--sans);margin:0 4px 0 0}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--hair);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--chip);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:.5px solid var(--hair);background:var(--chip);border-radius:8px;padding:5px 12px;font-size:12.5px}
.btn.primary{background:var(--ink);color:var(--chrome);border-color:var(--ink)}
.wrap{flex:1;display:flex;min-height:0}

/* ═══ reading colours and surfaces ═══ */
.stage{position:relative;flex:1;min-width:0;overflow:hidden;--paper:#FFFFFF;--sheet:#FDFCF9;--ptext:#2E302C;--desk:#E7E1D6}
.stage[data-col="paper"]{--paper:#F7F1E5;--sheet:#F8F2E6;--ptext:#3B3429;--desk:#E2D8C4}
.stage[data-col="sepia"]{--paper:#F2E6D0;--sheet:#F3E8D3;--ptext:#4A3C2A;--desk:#D9C7A8}
.stage[data-col="mist"]{--paper:#E9EBE8;--sheet:#EEF0ED;--ptext:#2C2F2B;--desk:#D2D6D1}
.stage[data-col="sage"]{--paper:#E8EDE4;--sheet:#EDF1EA;--ptext:#2D352B;--desk:#CCD6C4}
.stage[data-col="dusk"]{--paper:#2B2D33;--sheet:#2D2F35;--ptext:#CED0D4;--desk:#1C1D22}
.stage[data-col="night"]{--paper:#1A1B1D;--sheet:#1C1D1F;--ptext:#C9CBC6;--desk:#0E0F11}
.stage.flat{background:var(--paper)}
.stage.sheet{background:radial-gradient(ellipse 120% 90% at 50% -10%,color-mix(in srgb,var(--desk),#fff 45%),var(--desk) 55%,color-mix(in srgb,var(--desk),#000 8%)) fixed}
.stage[data-col="dusk"].sheet,.stage[data-col="night"].sheet{background:radial-gradient(ellipse 120% 90% at 50% -10%,color-mix(in srgb,var(--desk),#fff 8%),var(--desk) 55%,color-mix(in srgb,var(--desk),#000 30%)) fixed}
.scroller{position:absolute;inset:0;overflow:auto}
.page{position:relative;max-width:680px;margin:0 auto;padding:44px 52px 160px;font:17px/1.85 var(--serif);color:var(--ptext);user-select:none}
.sheet .page{margin:28px auto 140px;background:var(--sheet);border-radius:3px;padding-bottom:60px;
  box-shadow:0 1px 1px rgba(30,28,20,.05),0 14px 34px -12px rgba(40,30,15,.25),0 50px 80px -40px rgba(40,30,15,.25)}
.stage[data-col="dusk"].sheet .page,.stage[data-col="night"].sheet .page{box-shadow:0 0 0 .5px rgba(255,255,255,.04),0 14px 34px -12px rgba(0,0,0,.6),0 50px 80px -40px rgba(0,0,0,.7)}
.page p{margin:0 0 16px}
.page .ck{box-shadow:inset 0 -1.5px 0 currentColor}
.page .psp{border-radius:3px;transition:background .6s var(--ease),box-shadow .6s var(--ease)}
.page .psp.lit{background:var(--plit);box-shadow:0 0 0 3px var(--plit)}

/* ═══ the machine ═══ */
.mach{position:absolute;left:40px;top:250px;z-index:20;width:var(--w);--T:.36s;color:var(--cink)}
.card{position:relative;border-radius:var(--rd);background:var(--cbgfull);color:var(--cink);overflow:hidden;text-shadow:var(--glowS);
  box-shadow:var(--outline),var(--edgeS),0 1px 2px rgba(0,0,0,calc(.06 * var(--shd))),0 calc(10px * var(--shd)) calc(28px * var(--shd)) calc(-12px * var(--shd)) rgba(0,0,0,calc(.28 * var(--shd)))}
.grab{display:flex;justify-content:center;padding:6px 0 0;cursor:grab;touch-action:none;position:relative;z-index:2}
.grab i{width:32px;height:4px;border-radius:2px;background:currentColor;opacity:.14}
.has-tabs .grab{display:none}
.s{position:relative;padding:12px 18px}
.s.h{padding-top:6px}
.has-tabs .s.h{padding-top:14px}
.s.band{background:var(--band)}
.dense .s{padding-top:8px;padding-bottom:8px}
/* picture banner */
.banner{height:96px;position:relative;overflow:hidden}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.banner .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;background:var(--band)}
/* tabs */
.tabs{display:flex;gap:3px;padding:0 14px;position:relative;z-index:1}
.tab{border:0;padding:6px 12px 7px;border-radius:9px 9px 0 0;background:var(--tabbg);color:inherit;font:500 11.5px var(--sans);opacity:.7;position:relative;top:1px;transition:opacity .2s,background .2s}
.tab.on{background:var(--cbgsolid);opacity:1}
.tab.grabtab{cursor:grab;padding:6px 10px 7px;opacity:.4;touch-action:none}
.st-hand .tab{border-radius:2px 2px 0 0;font:400 14px var(--hand)}
.strip{display:flex;gap:16px;padding:10px 18px 0;font-size:11.5px}
.strip button{border:0;background:none;padding:0 0 4px;opacity:.55;box-shadow:inset 0 -1.5px 0 transparent;transition:opacity .2s,box-shadow .2s}
.strip button.on{opacity:1;box-shadow:inset 0 -1.5px 0 var(--acct)}
/* the page sentence: its own section above the head, or a panel from behind the card */
.card{z-index:2;transform:translateY(var(--push,0px));transition:transform var(--T) var(--ease)}
.card.nt{transition:none}
.pss .w.dim{opacity:.42}
.opl{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:7px;border-radius:50%;box-shadow:inset 0 0 0 1px currentColor;font:500 12px/1 var(--sans);font-style:normal;vertical-align:1px;transition:transform var(--T) var(--ease)}
.onp.on .opl{transform:rotate(45deg)}
.st-hand .xp::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--noise);background-size:160px;opacity:.35;mix-blend-mode:multiply}
.s.ps{padding:16px 18px 14px;border-bottom:1px solid var(--cline)}
.st-glass .s.ps{border-bottom:0;box-shadow:inset 0 -1px 0 var(--chi),inset 0 calc(-1px - var(--et)) 0 var(--cline)}
.st-hand .s.ps{border-bottom:0}
.st-hand .s.ps::after{content:"";position:absolute;left:16px;right:16px;bottom:-5px;height:10px;background:var(--wave) center/100% 10px no-repeat;opacity:.7}
.fold[data-fold="ps"]>div>*{transform:none}
.pshead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pshead .tag{flex:1}
.pclose{width:24px;height:24px;border:0;border-radius:50%;background:none;display:grid;place-items:center;opacity:.5;color:inherit;transition:opacity .2s,background .2s}
.pclose svg{width:12px;height:12px}
.react .pclose:hover{opacity:1;background:var(--hov)}
.pss{font:15px/1.6 var(--bf)}
.pss .w{display:inline-block;white-space:pre;transition:color .6s}
.pss .w.hide{opacity:0}
.pss.marked .w.k{color:var(--wordc)}
.pm-bold .pss.marked .w.k{font-weight:600;color:inherit}
.pm-both .pss.marked .w.k{font-weight:600}
.pstr{font:15px/1.6 var(--bf);padding-top:6px;opacity:0;transition:opacity .7s ease}
.pstr.on{opacity:.7}
.trsmall .pstr{font:13px/1.45 var(--sans)}
.onp .ok{transition:opacity .25s,font-weight .2s}
.onp.held{opacity:.95}.onp.held .ok{font-weight:600;color:var(--wordc)}
.onp .ok,.onp .oe{transition:opacity .25s}
.onp.flown .ok,.onp.flown .oe{opacity:0}
.onp.flown{box-shadow:none}
.fly{position:absolute;z-index:40;pointer-events:none;white-space:pre;transform-origin:0 0;margin:0}
.xp{position:absolute;left:0;top:0;width:100%;z-index:1;border-radius:var(--rd);background:var(--cbgfull);color:var(--cink);overflow:hidden;
  box-shadow:var(--outline),0 1px 2px rgba(0,0,0,.06),0 8px 22px -12px rgba(0,0,0,.28);transition:transform var(--T) var(--ease),opacity var(--T) ease}
.st-glass .xp{backdrop-filter:var(--gbf);-webkit-backdrop-filter:var(--gbf)}
.xp.k-drawer{left:22px;width:calc(100% - 44px)}
.xp.k-side{width:300px}
.xp .s.ps{border-bottom:0;box-shadow:none}
.xp .s.ps::after{display:none}
.xp.nt{transition:none}
.mrow{display:flex;gap:12px;align-items:flex-start}.mcol{flex:1;min-width:0}
.ho-caretline .hw.on{box-shadow:inset 0 -2px 0 color-mix(in srgb,currentColor 50%,transparent)}
.ho-caretline .hw.on .car,.ho-underline .hw.on .car{color:inherit}
.wheel .s.ex .sentbox,.wheel .s.ex .cnt{cursor:var(--excur)}
.exhint{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;font:500 11px var(--sans);padding:4px 9px;border-radius:999px;
  background:var(--hov);opacity:0;pointer-events:none;white-space:nowrap}
.exhint svg{width:10px;height:14px}
.exhint.go{animation:hint 2.6s ease both}
@keyframes hint{0%{opacity:0;transform:translate(-50%,4px)}18%,70%{opacity:.85;transform:translate(-50%,0)}100%{opacity:0}}
.mstep button{border:0;padding:0;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.2;transition:opacity .3s,transform .3s}
.mstep button.on{opacity:.7}
.react .mstep button:hover{transform:scale(1.4)}
.mstep.at-top{position:absolute;top:14px;right:18px;margin:0;gap:5px}
.mstep.at-left{position:absolute;left:7px;top:18px;margin:0;flex-direction:column;gap:5px}
.mstep.at-after{gap:5px}
.arh .side{opacity:0}
.arh .s.ex:hover .side{opacity:.55}
.arh .s.ex .side:hover{opacity:1}
.growtr>div>div{font:15px/1.5 var(--bf);opacity:.7;padding-bottom:10px}
.trsmall .growtr>div>div{font-size:13px}
/* head */
.hrow{display:flex;align-items:center;gap:10px}
.hwrap{display:flex;flex-direction:column;min-width:0}
.hline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hw{border:0;background:none;padding:0;text-align:left;font:var(--hwwt) var(--hws)/1.08 var(--hwf);letter-spacing:var(--hwls);color:inherit;text-shadow:var(--glowH);transition:color .35s,box-shadow .3s}
.hw .car{display:inline-block;font:400 14px var(--sans);opacity:.3;margin-left:7px;transition:transform var(--T) var(--ease),opacity .3s,color .3s;vertical-align:.25em;text-shadow:none}
.hw.on .car{transform:rotate(90deg);opacity:.9;color:var(--hwc)}
.ho-col .hw.on,.ho-caretcol .hw.on{color:var(--hwc)}
.ho-underline .hw.on{box-shadow:inset 0 -2px 0 var(--hwc)}
.onp{border:0;background:none;padding:0;font:italic 13px var(--bf);opacity:.55;text-align:left;color:inherit;transition:opacity .2s,box-shadow .3s}
.onp.above{font-size:12px;margin-bottom:1px;align-self:flex-start}
.onp.on{opacity:.95;box-shadow:inset 0 -1.5px 0 var(--acct)}
.kl{font-size:12.5px;margin-top:3px;opacity:.75;display:flex;gap:12px;flex-wrap:wrap}
.kl small{font-size:10.5px;opacity:.6;margin-right:4px;letter-spacing:.02em}
.lv{font:600 10.5px/1 var(--sans);letter-spacing:.04em;padding:4px 6px;border-radius:6px;background:var(--accbg);color:var(--acct);align-self:center;text-shadow:none}
.fq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;align-self:center}
.fq i{width:3px;border-radius:1px;background:currentColor;opacity:.16}
.fq i:nth-child(1){height:4px}.fq i:nth-child(2){height:6px}.fq i:nth-child(3){height:8px}.fq i:nth-child(4){height:10px}.fq i:nth-child(5){height:12px}
.fq i.on{opacity:.7;background:var(--acct)}
.thumb{flex:none;width:58px;height:44px;border-radius:calc(var(--rd) * .4);overflow:hidden;display:grid;place-items:center;background:var(--band)}
.thumb svg{width:100%;height:100%}.thumb .emo{font-size:30px}
.mpic{flex:none;width:64px;height:46px;border-radius:calc(var(--rd) * .4);overflow:hidden;display:grid;place-items:center;background:var(--hov)}
.mpic svg{width:100%;height:100%}.mpic .emo{font-size:30px}
.st-hand .thumb,.st-hand .mpic{border-radius:2px;background:transparent}
.sp{flex:1}
.ib{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:inherit;opacity:.7;transition:background .2s,opacity .2s,transform .2s var(--ease)}
.ib svg{width:17px;height:17px}
.ib.on{opacity:1;background:var(--accbg);color:var(--acct)}
.play{flex:none;width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--acct);background:var(--accbg);transition:transform .2s var(--ease),background .2s}
.play svg{width:10px;height:10px;margin-left:2px}
.play.sm{width:24px;height:24px}.play.sm svg{width:8px;height:8px}
.pl-ring .play{background:none;box-shadow:inset 0 0 0 1.25px currentColor;color:inherit;opacity:.75}
.pl-ink .play{background:var(--cink);color:var(--cbgsolid)}
.react .ib:hover{opacity:1;background:var(--hov)}
.react .ib.on:hover{background:var(--accbg)}
.react .play:hover{transform:scale(1.08)}
.react .ib:active,.react .play:active,.react .tb:active{transform:scale(.94)}
.react .hw:hover .car{opacity:.75}
/* folds */
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--T) var(--ease)}
.fold>div{overflow:hidden;min-height:0}
.fold>div>*{opacity:0;transform:translateY(-6px);transition:opacity calc(var(--T) * .7) ease,transform var(--T) var(--ease)}
.fold.open{grid-template-rows:1fr}
.fold.open>div>*{opacity:1;transform:none;transition-delay:calc(var(--T) * .22)}
.det{padding-top:10px;font-size:12.5px;display:grid;gap:8px}
.det .ipa{opacity:.5;font-size:12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px}
.facts small,.tag{display:block;font:600 10px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;opacity:.5}
.det .note{opacity:.85}
.psent{padding-top:10px}
.psent .orig{display:flex;gap:8px;align-items:flex-start;font:15px/1.45 var(--bf);cursor:pointer}
.psent .orig b{font-weight:600;color:var(--wordc)}
.psent .tr{font:15px/1.45 var(--bf);opacity:.7;padding:4px 0 0 32px}
.trsmall .psent .tr{font:13px/1.45 var(--sans)}
/* ask */
.ask{padding-top:12px}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.q{border:0;border-radius:999px;padding:5px 10px;font-size:12px;background:var(--hov);text-align:left;transition:background .2s}
.react .q:hover,.q.on{background:var(--accbg);color:var(--acct)}
.qin{display:flex;gap:6px;margin-top:8px}
.qin input{flex:1;min-width:0;border:0;border-radius:9px;padding:7px 10px;font:12.5px var(--sans);background:var(--hov);color:inherit}
.qin input::placeholder{color:inherit;opacity:.45}
.qin button{border:0;border-radius:9px;padding:0 10px;background:var(--accbg);color:var(--acct);font-size:12px}
.ans{margin-top:10px;font-size:13px;line-height:1.5}
.ans small{display:block;font-size:10.5px;opacity:.45;margin-top:4px}
.dots3{display:inline-flex;gap:4px}.dots3 i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.3;animation:bl 1s infinite}
.dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.8}}
/* meaning */
.l1{font:19px/1.3 var(--bf);cursor:pointer}
.l2{font-size:13.5px;opacity:.72}
.l2>div>div{padding-top:3px}
.l3>div>div{padding-top:8px;font-size:13.5px;line-height:1.5}
.cue{border:0;background:none;padding:0;margin-top:6px;font-size:11.5px;opacity:.55;display:block}
.react .cue:hover{opacity:.9}
.mstep{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.mstep i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.2;transition:opacity .3s}
.mstep i.on{opacity:.65}
/* examples */
.s.ex{padding-top:18px}
.exrow{position:relative}
.sentbox{min-height:3.4em;display:flex;align-items:center}
.ex-center .sentbox{justify-content:center;text-align:center}
.ar-sides .sentbox{padding:0 30px}
.sent{font:15.5px/1.45 var(--bf);will-change:transform}
.sent.tap{cursor:pointer}
.mk-bold .sent b{font-weight:700}
.mk-colour .sent b{font-weight:600;color:var(--wordc)}
.mk-underline .sent b{font-weight:600;box-shadow:inset 0 -2px 0 var(--wordc)}
.mk-marker .sent b{font-weight:500;background:linear-gradient(transparent 55%,var(--accbg) 55%);padding:0 2px;border-radius:2px}
.extr>div>div{font:15.5px/1.45 var(--bf);opacity:.68;padding-top:3px}
.trsmall .extr>div>div{font:13px/1.45 var(--sans)}
.ex-center .extr{text-align:center}
.ar-sides .extr>div>div{padding-left:30px;padding-right:30px}
.side{position:absolute;top:50%;margin-top:-14px}
.side.sl{left:-6px}.side.sr{right:-6px}
.exbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:10px}
.exbar .l{display:flex;gap:2px}.exbar .r{display:flex;justify-content:flex-end;gap:2px}
.nav{display:flex;align-items:center;gap:6px;font-size:11.5px}
.arr{width:28px;height:28px;border:0;border-radius:50%;background:none;display:grid;place-items:center;font-size:16px;line-height:1;opacity:.55;transition:background .25s,opacity .25s,transform .25s var(--ease)}
.react .arr:hover{opacity:1;background:var(--hov)}
.arr.kick{opacity:1;background:var(--accbg);color:var(--acct)}
.arr.kick.prev{transform:translateX(-3px)}.arr.kick.next{transform:translateX(3px)}
.cnt{opacity:.55;font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
.tb{border:0;background:none;height:28px;min-width:28px;padding:0 6px;border-radius:14px;display:inline-grid;place-items:center;font:600 10.5px var(--sans);letter-spacing:.04em;opacity:.65;transition:background .2s,opacity .2s,transform .2s var(--ease)}
.tb svg{width:15px;height:15px}
.tb.on{opacity:1;background:var(--accbg);color:var(--acct)}
.react .tb:hover{opacity:1;background:var(--hov)}
.react .tb.on:hover{background:var(--accbg)}
.acts-under .exbar{grid-template-columns:1fr}.acts-under .exbar .nav{justify-content:center}
.acts-under .exacts{display:flex;justify-content:center;gap:4px;margin-top:4px}
.acts-hover .exbar .l,.acts-hover .exbar .r,.acts-hover .exacts{opacity:0;transition:opacity .3s}
.acts-hover .s.ex:hover .exbar .l,.acts-hover .s.ex:hover .exbar .r,.acts-hover .s.ex:hover .exacts,.acts-hover .s.ex:focus-within .exbar .l,.acts-hover .s.ex:focus-within .exbar .r{opacity:1}

/* ═══ loading ═══ */
.ld,.ld *{color:transparent!important;text-shadow:none!important;pointer-events:none}
.lm-shimmer .ld{background:linear-gradient(90deg,var(--sk1) 0%,var(--sk2) 45%,var(--sk1) 90%) 0 0/250% 100%;animation:shim 1.5s linear infinite;border-radius:5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

    if(S.uiCol==='accent'){ accbg=lt?hsl(h,Math.min(s+10,70),70,.2):hsl(h,s,l,.13); acct=lt?hsl(h,Math.min(s+10,70),80):hsl(h,s,Math.max(20,l-8)); }
    else if(neutral){ accbg=lt?'rgba(255,255,255,.14)':'rgba(30,35,45,.08)'; acct=lt?'#F1F2EF':'#2E333B'; }
    else { accbg=lt?hsl(th,ts*.7,75,.2):hsl(th,Math.min(ts,70),45,.15); acct=lt?hsl(th,Math.min(ts,70),84):hsl(th,Math.min(ts,60),30); }
    set('--gbf',`blur(${S.gblur}px) saturate(140%)`); }
  else if(dk){
    const lift=6+S.darkLift/100*14;
    solid=S.fill==='white'?`hsl(225,8%,${17+S.darkLift/10}%)`:S.fill==='tint'?hsl(h,Math.min(s,40),14+S.darkLift/10+S.tint/14):`color-mix(in srgb,${page},#fff ${lift.toFixed(0)}%)`;
    ink='#E8E9E6'; line='rgba(0,0,0,.45)'; hi='rgba(255,255,255,.06)';
    band=`rgba(255,255,255,${(.02+ba*.07).toFixed(3)})`; hov='rgba(255,255,255,.08)';
    accbg=hsl(h,Math.min(s+10,70),70,.18); acct=hsl(h,Math.min(s+10,70),78); }
  else { lt=false;
    solid=S.fill==='white'?'#FFFFFF':S.fill==='tint'?hsl(h,Math.min(s,60),97-S.tint/9):`color-mix(in srgb,${page},#fff 55%)`;
    ink='#1D1F1C'; line=hsl(h,12,30,.16); hi='rgba(255,255,255,.85)';
    band=hsl(h,s,45,.02+ba*.08); hov=hsl(h,s,40,.08);
    accbg=hsl(h,s,l,.12); acct=hsl(h,s,Math.max(20,l-8)); }
  full=full||solid;
  if(g>0&&(st==='plain'||st==='hand')) full=`linear-gradient(180deg,rgba(255,255,255,${(g*(dk&&st==='plain'?.12:.55)).toFixed(3)}),rgba(255,255,255,0) 55%,rgba(0,0,0,${(g*.07).toFixed(3)})),${solid}`;
  const tabbg=lt?`color-mix(in srgb,${st==='glass'?'#2a2c31':solid},#000 18%)`:`color-mix(in srgb,${st==='glass'?'#f2f2f0':solid},#000 6%)`;
  /* headword colour when open: its own colour, the accent, or the glass's UI colour */
  const hwc=S.hwSrc==='accent'?acct:S.hwSrc==='ui'?acct:(lt?hsl(S.hwH,S.hwS,80):hsl(S.hwH,S.hwS,S.hwL));
  set('--cbgsolid',st==='glass'?(lt?'#33353b':'#f6f6f4'):solid); set('--cbgfull',full); set('--cink',ink); set('--cline',line); set('--chi',hi); set('--band',band); set('--hov',hov);
  set('--accbg',accbg); set('--acct',acct); set('--hwc',hwc); set('--wordc',st==='hand'?ink:acct); set('--tabbg',tabbg); set('--et',S.et+'px');
  set('--sk1',lt?'rgba(255,255,255,.07)':'rgba(30,40,50,.06)'); set('--sk2',lt?'rgba(255,255,255,.18)':'rgba(30,40,50,.13)');
  set('--rd',(st==='hand'?2:S.round)+'px'); set('--w',S.width+'px'); set('--shd',(S.shadow/100).toFixed(2));
  set('--outline',S.outline?`0 0 0 .5px ${lt?'rgba(255,255,255,.1)':'rgba(30,30,25,.14)'}`:'0 0 0 0 transparent');
  set('--edgeS',e>0?(dk?`inset 0 1px 0 rgba(255,255,255,${(e*.35).toFixed(2)}),0 0 0 1px rgba(255,255,255,${(e*.12).toFixed(3)}),0 0 ${Math.round(10+e*30)}px rgba(255,255,255,${(e*.08).toFixed(3)})`:`inset 0 1px 0 rgba(255,255,255,${(e*.9).toFixed(2)})`):'0 0 0 0 transparent');
  const gw=S.glow/100;
  if(gw>0){ const c=lt?'rgba(255,255,255,':`hsla(${h},${s}%,${l}%,`;
    set('--glowS',`0 0 ${(4+gw*6).toFixed(1)}px ${c}${(gw*(lt?.35:.18)).toFixed(2)})`);
    set('--glowH',`0 0 ${(6+gw*10).toFixed(1)}px ${c}${(gw*(lt?.6:.3)).toFixed(2)}),0 0 ${(16+gw*22).toFixed(1)}px ${c}${(gw*(lt?.3:.15)).toFixed(2)})`); }
  else { set('--glowS','none'); set('--glowH','none'); }
  set('--T',(.36*100/S.speed).toFixed(2)+'s'); set('--excur',S.exCursor==='mouse'?CURSOR:'ns-resize');
  const hf=st==='graphite'||st==='ivory'?'garamond':st==='hand'?'hand':S.hwf;
  set('--hwf',{serif:'var(--serif)',garamond:'var(--garamond)',sans:'var(--sans)',hand:'var(--hand)'}[hf]);
  set('--hwwt',hf==='hand'?'400':hf==='garamond'?'500':'600');
  set('--hwls',hf==='sans'?'-.02em':hf==='serif'?'-.012em':'0');
  set('--hws',(S.hws*(hf==='garamond'?1.25:hf==='hand'?1.2:hf==='sans'?.9:1))+'px');
  set('--bf',S.bf==='sans'?'var(--sans)':S.bf==='garamond'?'var(--garamond)':'var(--serif)');
  const dcol={ink,accent:hsl(h,s,Math.max(25,l-5)),red:'#C0504D',pencil:'#8A8D91'}[S.hdiv];
  set('--wave',`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 10' preserveAspectRatio='none'><path d='M2 5 C 60 3, 120 7, 180 5 S 270 4, 298 6' fill='none' stroke='${dcol}' stroke-width='1.4' stroke-linecap='round'${S.hsep==='dash'?" stroke-dasharray='5 5'":''}/></svg>`)}")`);
  set('--rule',S.hpaper==='blue'?'rgba(70,110,180,.22)':'rgba(90,130,200,.2)');
  stage.style.setProperty('--plit',lt&&dk?hsl(h,60,70,.16):hsl(h,s,l,.13));
  const hs=S.hsep==='wash'?'band':S.hsep;

}

/* ═══ the page sentence as words, so the page form can fly into it ═══ */
function tokens(x){ return x.psent.split(/(<b>.*?<\/b>)/).flatMap(part=>part.startsWith('<b>')?[{k:true,t:part.replace(/<\/?b>/g,'')}]:part.split(/(?<=\s)/).filter(Boolean).map(t=>({k:false,t}))); }

function restCls(){ return S.sentAt==='section'?'hide':S.wordsIn==='merge'?'dim':'hide'; }
function psHTML(x){ let ki=0; const sec=S.sentAt==='section', rc=restCls();
  const w=tokens(x).map(t=>t.k?`<span class="w k${sec?' hide':''}" data-k="${ki++}">${t.t}</span>`:`<span class="w ${rc}">${t.t}</span>`).join('');
  return `<div class="s ps"><div class="pshead"><span class="tag">Full sentence</span><button class="play sm" data-act="saypage" aria-label="Play this sentence">${I.play}</button><button class="pclose" data-act="psclose" aria-label="Fold the sentence away"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5l3-3 3 3"/></svg></button></div>
    <div class="pss${sec?'':' marked'}" id="pss">${w}</div><div class="pstr" id="pstr">${x.ptr}</div></div>`; }

/* ═══ build the card; afterwards only classes and text change ═══ */
function render(){
  const x=it(), M=x.m[S.mlang], n=x.examples.length, pic=picHTML(x);
  const lvl=(S.level==='chip'||S.level==='both'?`<span class="lv" data-slot="a">${x.level}</span>`:'')
    +(S.level==='bars'||S.level==='both'?`<span class="fq" title="How common">${[1,2,3,4,5].map(i=>`<i class="${i<=x.freq?'on':''}"></i>`).join('')}</span>`:'');
  const onp=`<button class="onp${S.onp==='above'?' above':''}" data-act="ps" title="Full sentence"><span data-slot="z">${onpHTML(x)}</span><span class="opl" aria-hidden="true">+</span></button>`;
  const kl=S.keyline==='shown'&&x.key?`<div class="kl">${x.key.map(([k,v])=>`<span data-slot="a"><small>${k}</small>${v}</span>`).join('')}</div>`:'';
  const head=`<div class="hrow"><button class="play" data-act="say" aria-label="Play pronunciation">${I.play}</button>
      <div class="hwrap">${S.onp==='above'?onp:''}<div class="hline"><button class="hw" data-act="d-word" data-on="word"><span data-slot="z">${x.item}</span><span class="car">›</span></button>${S.onp==='after'?onp:''}${lvl}</div>${kl}</div>
      <span class="sp"></span>${pic&&S.picAt==='head'?`<span class="thumb">${pic}</span>`:''}${aiBtn()}</div>
    <div class="fold" data-fold="word"><div><div class="det" data-slot="b">
      <div class="facts">${x.facts.map(([k,v])=>`<span><small>${k}</small>${v}</span>`).join('')}</div>
      ${x.note?`<div class="note">${x.note}</div>`:''}${S.ipa==='bottom'?`<div class="ipa">${x.ipa}</div>`:''}</div></div></div>
    <div class="fold" data-fold="ask"><div><div class="ask">
      <span class="tag">Ask about ${x.item}, here</span>
      <div class="qs">${x.qa.map(([q],i)=>`<button class="q" data-act="q" data-i="${i}">${q}</button>`).join('')}</div>
      <form class="qin" data-form><input id="askIn" placeholder="Or ask your own question" aria-label="Your question"><button type="submit">Ask</button></form>
      <div class="ans" id="ans">${U.ans}</div></div></div></div>`;
  const mstep=()=>`<span class="mstep at-${S.mstepAt}">${[1,2,3].map(i=>`<button data-act="lstep" data-step="${i}" aria-label="Meaning layer ${i}"></button>`).join('')}</span>`;
  const mean=`${S.mean==='click'&&S.mstepAt!=='after'?mstep():''}<div class="mrow"><div class="mcol"><div><span class="l1" data-act="l1" data-slot="a">${M[0]}</span>${S.mean==='click'&&S.mstepAt==='after'?mstep():''}</div>
    <div class="fold l2" data-fold="l2"><div><div data-slot="b">${M[1]}</div></div></div>
    <div class="fold l3" data-fold="l3"><div><div data-slot="b">${M[2]}</div></div></div>
    ${S.mean!=='click'&&S.deeper!=='none'?`<div class="fold" data-fold="cue"><div><div><button class="cue" data-act="deeper" id="cue"></button></div></div></div>`:''}</div>${pic&&S.picAt==='meaning'?`<span class="mpic">${pic}</span>`:''}</div>`;
  const [s,tr]=x.examples[U.ex];
  const nav=S.arrows==='around'?`<div class="nav"><button class="arr prev" data-act="prev" aria-label="Previous example">‹</button><span class="cnt" id="cnt" data-slot="c" title="Scroll to see more">${U.ex+1} of ${n}</span><button class="arr next" data-act="next" aria-label="Next example">›</button></div>`
    :`<div class="nav"><span class="cnt" id="cnt" data-slot="c" title="Scroll to see more">${U.ex+1} of ${n}</span></div>`;
  const aSpeak=`<button class="tb" data-act="sayex" aria-label="Play sentence" title="Listen">${I.speak}</button>`;
  const aTr=`<button class="tb" data-act="extr" data-on="extr" aria-label="Show translation" title="Translation">${x.yours}</button>`;
  const aAdd=S.addBtn?`<button class="tb" data-act="add" id="addb" aria-label="Add sentence to library" title="Add to library">${I.add}</button>`:'';
  const bar=S.acts==='under'?`<div class="exbar">${nav}</div><div class="exacts">${aSpeak}${aTr}${aAdd}</div>`
    :`<div class="exbar"><div class="l">${aSpeak}${aTr}</div>${nav}<div class="r">${aAdd}</div></div>`;
  const ex=`<div class="exrow">${S.arrows==='sides'?`<button class="arr prev side sl" data-act="prev" aria-label="Previous example">‹</button><button class="arr next side sr" data-act="next" aria-label="Next example">›</button>`:''}
    <div class="sentbox" data-swipe><div class="sent${S.tapS!=='none'?' tap':''}" data-act="tapsent" id="sent"><span data-slot="c">${s}</span></div></div></div>
    <div class="fold extr" data-fold="extr"><div><div id="extr">${tr}</div></div></div>${bar}<div class="exhint" id="exhint">${S.exCursor==='arrows'?UPDOWN:MOUSE}<span>Scroll to see more</span></div>`;
  const TABS=[['word','Word'],['ps','Sentence'],['ask','Ask']];
  const tabs=S.tabs==='folder'?`<div class="tabs">${TABS.map(([k,l])=>`<button class="tab" data-act="d-${k}" data-on="${k}">${l}</button>`).join('')}<span class="sp"></span><button class="tab grabtab" data-grab aria-label="Move the card">⋮⋮</button></div>`:'';
  const strip=S.tabs==='strip'?`<div class="strip">${TABS.map(([k,l])=>`<button data-act="d-${k}" data-on="${k}">${l}</button>`).join('')}</div>`:'';
  const secs=[['h',head],['m',mean],['ex',ex]];
  const bandOn=i=>S.style==='glass'?false:S.band==='alt'?i%2===0:S.band==='head'?i===0:S.band==='all';
  const banner=pic&&S.picAt==='banner'?`<div class="banner">${S.pic==='emoji'?pic:pic}</div>`:'';
  const sec=S.sentAt==='section';
  mach.innerHTML=(sec?'':`<div class="xp k-${S.sentAt}" id="xp">${psHTML(x)}</div>`)+tabs+`<div class="card">${S.tabs==='off'&&!banner?'<div class="grab" data-grab><i></i></div>':''}${banner}${strip}${sec?`<div class="fold" data-fold="ps"><div>${psHTML(x)}</div></div>`:''}${secs.map(([k,c],i)=>`<div class="s ${k}${bandOn(i)?' band':''}">${c}</div>`).join('')}</div>`;
  if(banner) $('.banner',mach).setAttribute('data-grab','');
  applyLook();
  if(S.tabs==='strip'){ const hd=$('.s.h',mach); if(hd) hd.style.paddingTop='10px'; }
  mach.querySelectorAll('.fold').forEach(f=>f.style.transition='none'); upd(); placeXP('hidden',true);
  const xpEl=$('#xp'); if(xpEl) new ResizeObserver(()=>{ if(U.ps) placeXP('open'); }).observe($('.card',mach));

}
function layers(){
  if(S.mean==='click') return {l2:U.l>=2,l3:U.l>=3,cue:false};
  const l2=S.mean==='shown'||U.hov||U.l2pin||U.l3;
  return {l2,l3:U.l3&&S.deeper==='more',cue:l2};
}
function upd(){
  const L=layers(), x=it(), f=(k,v)=>$$(`[data-fold="${k}"]`,mach).forEach(e=>e.classList.toggle('open',!!v));
  f('word',U.open.word); f('ask',U.open.ask); f('ps',U.ps);
  f('l2',L.l2); f('l3',L.l3); f('cue',L.cue); f('extr',U.extr);
  $$('[data-on]',mach).forEach(b=>{ const k=b.dataset.on; b.classList.toggle('on',k==='extr'?U.extr:k==='ps'?U.ps:!!U.open[k]); });
  $('.onp',mach)?.classList.toggle('on',U.ps); $('#psp')?.classList.toggle('lit',U.ps);
  $$('.mstep button',mach).forEach(i=>i.classList.toggle('on',+i.dataset.step<=U.l));
  if(U.ps&&S.sentAt!=='section'&&!psBusy) placeXP('open');
  const cue=$('#cue'); if(cue) cue.textContent=S.deeper==='ask'?`${S.cueWord} · ask ›`:(U.l3?'Less':`${S.cueWord} ›`);
  const ab=$('#addb'); if(ab){ const on=!!U.added[x.item+'|'+U.ex]; ab.classList.toggle('on',on); ab.innerHTML=on?I.added:I.add; ab.title=on?'In your library':'Add to library'; }
}

/* ═══ loading: the card arrives with the word, the rest fills in by stage ═══ */
const POOL='aeiounrstlcdmphgbvy';
const gib=s=>s.replace(/<[^>]+>/g,'').replace(/[^\s…,.'/·]/g,()=>POOL[Math.random()*POOL.length|0]);
let LT=[];
function load(){
  LT.forEach(clearTimeout); LT=[]; U.loading=true;
  mach.classList.remove('enter'); void mach.offsetWidth; mach.classList.add('enter');
  const mode=S.style==='hand'&&S.lmode!=='shimmer'?'write':S.lmode;
  $$('[data-slot]',mach).forEach(el=>{ if(el.dataset.slot==='z'&&mode==='shimmer'){ delete el.dataset.src; return; } el.dataset.src=el.innerHTML;
    if(mode==='shimmer') el.classList.add('ld');
    else if(mode==='blur'){ el.innerHTML=gib(el.dataset.src); el.classList.add('ldb'); }
    else el.classList.add('ldh'); });
  if(S.hold) return;
  const k=S.net==='slow'?2.6:1, at=(ms,fn)=>LT.push(setTimeout(fn,ms*k));
  at(260,()=>arrive('z')); at(900,()=>arrive('a')); at(1600,()=>arrive('b')); at(2300,()=>{ arrive('c'); U.loading=false; });
}
function arrive(slot){
  const mode=S.style==='hand'&&S.lmode!=='shimmer'?'write':S.lmode;
  let acc=0;
  $$(`[data-slot="${slot}"]`,mach).forEach(el=>{
    if(el.dataset.src==null) return;
    if(mode==='shimmer'){ el.classList.remove('ld'); el.classList.remove('arrive'); void el.offsetWidth; el.classList.add('arrive'); return; }

    <div class="chips" data-k="acc"><span class="lab">Accent</span>${Object.keys(ACC).map(n=>`<button data-v="${n}">${sw(n)}${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div>
    ${sl('accH','Hue',0,359)}${sl('accS','Strength',0,90)}${sl('accL','Lightness',20,70)}
    ${ch('fill','Plain card colour',[['white','White'],['match','Matches the page'],['tint','Tinted']])}
    ${sl('tint','Tint strength',0,100)}
    ${ch('band','Bands',[['alt','Alternate'],['head','Head only'],['all','All banded'],['none','None']])}
    ${sl('bandAmt','Band strength',0,100)}${sl('grad','Gradient',0,100)}
    ${sl('darkLift','Dusk/Night lift',0,100)}${sl('edge','Edge light',0,100)}${sl('glow','Text glow',0,100)}</details>
  <details id="glassBox"><summary>Glass</summary>
    <div class="chips" data-k="gtone"><span class="lab">Tone</span>${Object.keys(GT).map(n=>`<button data-v="${n}">${gsw(n)}${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div>
    ${ch('uiCol','Chips and marks take',[['tone','The glass tone'],['neutral','Neutral'],['accent','The accent']])}
    ${sl('frost','Frost',0,90)}${sl('gblur','Blur',0,40)}${sl('et','Etch depth',1,4)}</details>
  <details id="handBox"><summary>Handwritten</summary>
    ${ch('hpaper','Paper',Object.keys(PAPERS).map(k=>[k,k[0].toUpperCase()+k.slice(1)]))}
    ${ch('hrule','Ruled like an index card',[['false','No'],['true','Yes']])}
    ${ch('hink','Ink',[['graphite','Graphite'],['blue','Blue-black'],['sepia','Sepia']])}
    ${ch('hsep','Between sections',[['dash','Dashed line'],['line','Drawn line'],['wash','Marker wash']])}
    ${ch('hdiv','Line colour',[['ink','Ink'],['accent','Accent'],['red','Red pencil'],['pencil','Grey pencil']])}
    ${ch('htilt','Lie',[['true','Slightly turned'],['false','Straight']])}</details>
  <details><summary>Card</summary>
    ${sl('shadow','Shadow',0,100)}${ch('outline','Outline',[['true','On'],['false','Off']])}
    ${sl('round','Corners',0,28)}${sl('width','Width',320,460)}
    ${ch('dense','Spacing',[['false','Comfortable'],['true','Compact']])}
    ${ch('react','Buttons react to cursor',[['true','Yes'],['false','No']])}</details>
  <details><summary>Type and play button</summary>
    ${ch('hwf','Headword face',[['serif','Serif'],['garamond','Garamond'],['sans','Sans']])}
    ${sl('hws','Headword size',22,40)}
    ${ch('bf','Meaning and sentences',[['serif','Serif'],['garamond','Garamond'],['sans','Sans']])}
    ${ch('play','Play button',[['ring','Ring'],['soft','Soft accent'],['ink','Solid']])}
    ${sl('speed','Motion speed',40,200)}</details>
  <details open><summary>Looks</summary>
    <p class="about" id="lookfor"></p>
    <div class="btns"><button class="btn primary" id="save">Save look for this page</button><button class="btn" id="copy">Copy all</button><button class="btn" id="reset">Reset</button></div>
    <div class="paste"><input id="pasteIn" placeholder="Paste a look from a chat" aria-label="Paste a look"><button class="btn" id="load">Load</button></div>
    <p class="note2">Each page colour and surface keeps its own look. Saved in this browser.</p></details>`;
  ctl.addEventListener('input',e=>{ const k=e.target.dataset.k; if(!k) return; S[k]=+e.target.value; sync(); if(k==='width') render(); else applyLook(); persist(); });
  ctl.addEventListener('click',e=>{
    const p=e.target.closest('[data-preset]'); if(p){ Object.assign(S,PRESETS[p.dataset.preset]); sync(); render(); persist(); return toast(p.dataset.preset); }
    const b=e.target.closest('.chips button'); if(!b) return; const k=b.parentNode.dataset.k; let v=b.dataset.v;
    if(v==='true'||v==='false') v=v==='true'; S[k]=v; if(k==='acc'){ [S.accH,S.accS,S.accL]=ACC[v]; }
    if(k==='tabs'&&v!=='off'){ const first=Object.keys(U.open).find(o=>U.open[o]); Object.keys(U.open).forEach(o=>U.open[o]=o===first); if(first) U.ps=false; }
    if(['sentAt','psDir','onp','wordsIn','psPeek'].includes(k)){ U.ps=false; U.peek=false; psBusy=false; }
    if(k==='mean'||k==='deeper'){ U.l=1; U.l3=false; U.hov=false; U.l2pin=false; }
    sync(); render(); persist(); if(['lmode','net','hold'].includes(k)) load(); });
  $('#save').onclick=()=>{ LOOKS[lookKey()]=pick(); persist(); toast('Saved for '+lookName()); sync(); };
  $('#copy').onclick=()=>copy('Card Machine 8 '+JSON.stringify({current:S,looks:LOOKS}));
  $('#reset').onclick=()=>{ const keep={col:S.col,surf:S.surf,style:S.style}; Object.assign(S,DEF,keep); resetU(); sync(); render(); persist(); toast('Back to the starting look'); };
  $('#load').onclick=()=>{ try{ const raw=$('#pasteIn').value; const j=JSON.parse(raw.slice(raw.indexOf('{')));
      const src=j.current||j; Object.keys(DEF).forEach(k=>{ if(k in src) S[k]=src[k]; }); if(j.looks) Object.assign(LOOKS,j.looks);
      if(src.openSign) S.hwOpen=src.openSign==='caret'?'caretcol':src.openSign==='tint'?'col':'underline';
      sync(); render(); persist(); toast('Look loaded'); }catch(err){ toast('That text is not a look. Copy it again from the page.'); } };
}
function sync(){
  $$('#ctl input[type=range]').forEach(i=>{ i.value=S[i.dataset.k]; });
  $$('#ctl output').forEach(o=>o.textContent=S[o.dataset.o]);
  $$('#ctl .chips').forEach(c=>$$('button',c).forEach(b=>b.classList.toggle('on',String(S[c.dataset.k])===b.dataset.v)));
  $$('#styleSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.style));
  $$('#colSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.col));
  $$('#surfSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.surf));
  const hb=$('#handBox'); if(hb&&S.style==='hand') hb.open=true;
  const gb=$('#glassBox'); if(gb&&S.style==='glass') gb.open=true;
  const lf=$('#lookfor'); if(lf) lf.textContent=`Page: ${lookName()}${LOOKS[lookKey()]?' · saved look in use':' · no saved look yet'}`;
}
const lookKey=()=>S.col+'/'+S.surf;
const lookName=()=>COLS.find(c=>c[0]===S.col)[1]+(S.surf==='sheet'?', raised sheet':', flat');
const pick=()=>Object.fromEntries(LOOK.map(k=>[k,S[k]]));
let LOOKS={};
const LS='cardMachine.v8';
function persist(){ try{ localStorage.setItem(LS,JSON.stringify({S,LOOKS})); }catch(e){} }
function restore(){ try{ const j=JSON.parse(localStorage.getItem(LS)||'null'); if(j){ Object.assign(S,j.S||{}); LOOKS=j.LOOKS||{}; } }catch(e){} }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function copy(txt){ const done=()=>toast('Copied. Paste it into the chat.');
  const fb=()=>{ const i=$('#pasteIn'); i.value=txt; i.select(); toast('Selected. Press Ctrl+C to copy.'); };
  try{ navigator.clipboard.writeText(txt).then(done,fb); }catch(e){ fb(); } }
function segs(){
  $('#styleSeg').innerHTML=STYLES.map(([v,l])=>`<button data-v="${v}">${l}</button>`).join('');
  $('#colSeg').innerHTML=COLS.map(([v,l])=>`<button data-v="${v}">${l}</button>`).join('');
  $('#surfSeg').innerHTML=[['flat','Flat'],['sheet','Raised sheet']].map(([v,l])=>`<button data-v="${v}">${l}</button>`).join('');
  $('#styleSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S.style=b.dataset.v; sync(); render(); persist(); };
  const pg=(k,v)=>{ S[k]=v; const lk=LOOKS[lookKey()]; if(lk) Object.assign(S,lk); sync(); render(); persist(); };
  $('#colSeg').onclick=e=>{ const b=e.target.closest('button'); if(b) pg('col',b.dataset.v); };
  $('#surfSeg').onclick=e=>{ const b=e.target.closest('button'); if(b) pg('surf',b.dataset.v); };
  $('#next').onclick=()=>{ IDX++; resetU(); buildPage(); render(); if(S.loadNext) load(); };
  $('#replay').onclick=()=>{ resetU(); render(); load(); };
}
restore(); segs(); buildCtl(); sync(); buildPage(); render();
</script>

</body></html>
